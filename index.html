<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EUROTRIP · Guía de Viaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1a2744; --gold: #c8a97e; --gold-dark: #a0824f;
    --terracotta: #b45c36; --cream: #f7f4ef; --cream-dark: #ede9e2;
    --white: #ffffff; --text-main: #1e1e1e; --text-muted: #666;
    --text-light: #999; --border: #e0ddd6; --green: #3d7a52;
    --purple: #6b3fa0; --blue: #2563a8;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--text-main); }
  .hero { background: var(--navy); padding: 4rem 2rem 3rem; text-align: center; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 60%, rgba(200,169,126,0.1) 0%, transparent 55%), radial-gradient(ellipse at 75% 20%, rgba(200,169,126,0.07) 0%, transparent 45%); }
  .hero-inner { position: relative; max-width: 640px; margin: 0 auto; }
  .hero-eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; font-weight: 500; }
  .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight: 400; color: #fff; line-height: 1.12; margin-bottom: 0.875rem; }
  .hero h1 em { font-style: italic; color: var(--gold); }
  .hero-sub { font-size: 15px; color: rgba(255,255,255,0.5); font-weight: 300; margin-bottom: 2rem; }
  .city-pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .city-pill { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 6px 16px; font-size: 13px; color: rgba(255,255,255,0.75); cursor: pointer; transition: all 0.18s; user-select: none; font-family: 'Inter', sans-serif; }
  .city-pill:hover { background: rgba(200,169,126,0.2); border-color: var(--gold); color: #fff; }
  .city-pill.active { background: var(--gold); border-color: var(--gold); color: var(--navy); font-weight: 500; }
  .cat-nav { background: var(--white); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; padding: 0 2rem; display: flex; align-items: center; gap: 0; overflow-x: auto; scrollbar-width: none; }
  .cat-nav::-webkit-scrollbar { display: none; }
  .cat-btn { padding: 1rem 1.1rem; border: none; border-bottom: 2px solid transparent; background: transparent; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; color: var(--text-muted); white-space: nowrap; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
  .cat-btn:hover { color: var(--text-main); }
  .cat-btn.active { color: var(--navy); border-bottom-color: var(--gold); }
  .cat-icon { font-size: 15px; }
  .main { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }
  .city-intro { display: flex; align-items: flex-start; gap: 2rem; background: var(--white); border-radius: 16px; border: 1px solid var(--border); padding: 1.75rem 2rem; margin-bottom: 2.5rem; }
  .city-flag { font-size: 3rem; line-height: 1; flex-shrink: 0; }
  .city-intro h2 { font-family: 'Playfair Display', serif; font-size: 1.75rem; font-weight: 400; color: var(--navy); margin-bottom: 0.375rem; }
  .city-intro p { font-size: 14px; color: var(--text-muted); line-height: 1.65; max-width: 580px; }
  .city-meta-row { display: flex; flex-wrap: wrap; gap: 1.25rem; margin-top: 0.875rem; }
  .meta-chip { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-muted); background: var(--cream); border: 1px solid var(--border); padding: 4px 10px; border-radius: 12px; }
  .section-header { margin-bottom: 1.25rem; }
  .section-header h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 400; color: var(--navy); margin-bottom: 0.25rem; }
  .section-header p { font-size: 13px; color: var(--text-muted); }

  /* PRICE FILTER */
  .price-filter { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
  .price-filter-label { font-size: 12px; color: var(--text-light); font-weight: 500; margin-right: 4px; }
  .price-chip { border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 12px; background: var(--white); cursor: pointer; transition: all 0.15s; color: var(--text-muted); user-select: none; font-family: 'Inter', sans-serif; font-weight: 500; }
  .price-chip:hover { border-color: var(--gold); color: var(--text-main); }
  .price-chip.active.all { background: var(--navy); border-color: var(--navy); color: #fff; }
  .price-chip.active.cheap { background: #2e7d32; border-color: #2e7d32; color: #fff; }
  .price-chip.active.mid { background: #e65100; border-color: #e65100; color: #fff; }
  .price-chip.active.high { background: #6a1b9a; border-color: #6a1b9a; color: #fff; }

  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { background: var(--white); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.07); border-color: var(--gold); }
  .card.hidden { display: none; }
  .card-body { padding: 1.25rem; }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.5rem; }
  .card-name { font-size: 15px; font-weight: 600; color: var(--text-main); line-height: 1.3; }
  .card-badges { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; flex-shrink: 0; }
  .card-badge { font-size: 10px; font-weight: 500; padding: 3px 9px; border-radius: 10px; white-space: nowrap; }
  .badge-beach { background: #e8f4fd; color: #1a5f8a; border: 1px solid #b8d9f0; }
  .badge-food { background: #fdf3e7; color: #8a5f1e; border: 1px solid #e8d4a0; }
  .badge-activity { background: #edf5f0; color: #2e6040; border: 1px solid #a8d4b8; }
  .badge-museum { background: #eef0f6; color: #1a2744; border: 1px solid #c0c8de; }
  .badge-shopping { background: #faeee9; color: #7a3018; border: 1px solid #e0b09a; }
  .badge-disco { background: #f3e8fc; color: #5a1a8a; border: 1px solid #d4a8f0; }
  .badge-mirador { background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
  .badge-price-cheap { background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
  .badge-price-mid { background: #fff3e0; color: #bf360c; border: 1px solid #ffcc80; }
  .badge-price-high { background: #f3e5f5; color: #4a148c; border: 1px solid #ce93d8; }
  .card-location { font-size: 12px; color: var(--text-light); display: flex; align-items: center; gap: 4px; margin-bottom: 0.625rem; }
  .card-location::before { content: '📍'; font-size: 11px; }
  .card-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
  .card-footer { padding: 0.75rem 1.25rem; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11px; padding: 3px 9px; border-radius: 8px; background: var(--cream); color: var(--text-muted); border: 1px solid var(--border); }
  .tip-callout { background: #fff8ee; border-left: 3px solid var(--gold); border-radius: 0 10px 10px 0; padding: 0.875rem 1.125rem; margin-bottom: 1.5rem; }
  .tip-callout p { font-size: 13px; color: #7a5a2e; line-height: 1.55; }
  .tip-callout strong { font-weight: 600; }
  @media (max-width: 640px) { .city-intro { flex-direction: column; gap: 1rem; } .cards-grid { grid-template-columns: 1fr; } .cat-nav { padding: 0 0.5rem; } .main { padding: 1.5rem 1rem 3rem; } }
</style>
</head>
<body>
<div class="hero">
  <div class="hero-inner">
    <p class="hero-eyebrow">guía de viaje · europa 2026</p>
    <h1>Tu <em>EUROTRIP</em><br>todo en un lugar</h1>
    <p class="hero-sub">Playas, restaurantes, actividades, museos y más — para consultar cuando quieras</p>
    <div class="city-pills" id="cityPills"></div>
  </div>
</div>
<nav class="cat-nav" id="catNav">
  <button class="cat-btn active" data-cat="playas"><span class="cat-icon">🏖</span> Playas</button>
  <button class="cat-btn" data-cat="restaurantes"><span class="cat-icon">🍽</span> Restaurantes</button>
  <button class="cat-btn" data-cat="actividades"><span class="cat-icon">🎯</span> Actividades</button>
  <button class="cat-btn" data-cat="museos"><span class="cat-icon">🏛</span> Museos</button>
  <button class="cat-btn" data-cat="comercio"><span class="cat-icon">🛍</span> Comercio</button>
  <button class="cat-btn" data-cat="discotheques"><span class="cat-icon">🎧</span> Discotecas</button>
  <button class="cat-btn" data-cat="miradores"><span class="cat-icon">🌅</span> Miradores</button>
</nav>
<div class="main">
  <div id="cityIntro" class="city-intro"></div>
  <div id="sections"></div>
</div>
<script>
const data = {
  barcelona: {
    name:'Barcelona',flag:'🇪🇸',country:'España',
    desc:'La capital catalana combina playa, arquitectura modernista y una escena gastronómica de primer nivel. Es una ciudad para caminar, perderse en sus barrios y comer bien a cualquier hora.',
    bestTime:'May–Sep',temp:'22°C verano',moneda:'Euro',idioma:'Español / Catalán',
    playas:{tip:'Las playas de Barcelona están dentro de la ciudad, muy accesibles en metro (línea 4). Llega antes de las 10h en verano para conseguir buen sitio.',items:[
      {name:'Barceloneta',location:'Barceloneta, 15 min a pie del centro',badge:'badge-beach',desc:'La playa más icónica y céntrica de Barcelona. Arena fina, aguas tranquilas y un paseo marítimo lleno de vida. Perfecta para el primer día — rodeada de bares y chiringuitos. En verano se llena mucho, pero el ambiente es inigualable.',tags:['Céntrica','Chiringuitos','Animada']},
      {name:'Playa de la Mar Bella',location:'Poblenou, 20 min en metro',badge:'badge-beach',desc:'Más tranquila que Barceloneta y con mejor onda local. Tiene una zona nudista al norte y una piscina de agua salada. El barrio de Poblenou alrededor es perfecto para tomar algo después.',tags:['Menos turística','Piscina salada','Local']},
      {name:'Playa de Bogatell',location:'Poblenou, 25 min en metro',badge:'badge-beach',desc:'Una de las playas más limpias y amplias de la ciudad. Menos masificada que Barceloneta, con buenas instalaciones deportivas — canchas de vóley y zona de ejercicios.',tags:['Limpia','Deportiva','Amplia']},
      {name:'Playa de Nova Icaria',location:'Vila Olímpica, 20 min en metro',badge:'badge-beach',desc:'Justo detrás del Puerto Olímpico, tranquila y bien equipada. Los chiringuitos tienen buena relación calidad-precio y los rascacielos olímpicos de fondo son un telón único.',tags:['Tranquila','Puerto Olímpico','Equipada']},
      {name:'Playa de Sitges',location:'Sitges, 40 min en tren desde Passeig de Gràcia',badge:'badge-beach',desc:'El escape favorito de los barceloneses. El pueblo de Sitges es encantador, con calles medievales, bares y vida nocturna animada. Las playas son más bonitas que las de la ciudad, con aguas más limpias.',tags:['Excursión','Pueblo pintoresco','Aguas limpias']},
      {name:'Playa de Castelldefels',location:'Castelldefels, 30 min en tren R2',badge:'badge-beach',desc:'Playa larga y amplia a 30 minutos de Barcelona en tren. Mucho más espacio que Barceloneta, con zonas de windsurf y chiringuitos con arroz y paella frente al mar.',tags:['30 min en tren','Amplia','Paellas']},
      {name:'Cala Llevadó (Costa Brava)',location:'Tossa de Mar, 1h30 en bus',badge:'badge-beach',desc:'Si tienes un día libre, la Costa Brava es otra dimensión. Calas de agua turquesa entre pinos y rocas. Tossa de Mar tiene un castillo medieval sobre el mar.',tags:['Excursión día','Aguas turquesas','Castillo medieval']}
    ]},
    restaurantes:{tip:'En Barcelona se come tarde: almuerzo entre 14h–16h, cena después de las 21h. Reserva siempre que puedas. El menú del día (12–16€) es la mejor relación precio-calidad.',items:[
      {name:'Bar del Pla',location:'El Born, Carrer de la Montcada 2',badge:'badge-food',price:'mid',desc:'Tapas catalanas de calidad en el corazón del Born. Croquetas de jamón, pan con tomate y huevos rotos imprescindibles. Ambiente animado y precios razonables.',tags:['Tapas','Catalán','Reserva recomendada']},
      {name:'Cervecería Catalana',location:'Eixample, Carrer de Mallorca 236',badge:'badge-food',price:'mid',desc:'El brunch-almuerzo más popular del Eixample. Famosa por sus montaditos, patatas bravas y una selección enorme de tapas. Llega antes de abrir o reserva con días de anticipación.',tags:['Tapas','Brunch','Siempre lleno']},
      {name:'Bodega Sepúlveda',location:'Eixample esquerra, Carrer de Sepúlveda 173',badge:'badge-food',price:'cheap',desc:'Bodega catalana de barrio con mesas de madera, vinos a granel y cocina casera contundente. Los fideos a la cazuela y el conejo con romesco son extraordinarios. Ambiente completamente local.',tags:['Bodega','Local','Sin turistas']},
      {name:'Bar Marsella',location:'El Raval, Carrer de Sant Pau 65',badge:'badge-food',price:'cheap',desc:'El bar más antiguo de Barcelona (1820). Las botellas de absenta llevan décadas en los estantes, hay polvo en los espejos y el ambiente es de otra época. La absenta es la bebida. Una visita cultural obligatoria.',tags:['Bar histórico','Absenta','Desde 1820']},
      {name:'El Nacional',location:'Passeig de Gràcia 24, Eixample',badge:'badge-food',price:'mid',desc:'Cuatro restaurantes y cuatro bares bajo el techo de una antigua fábrica. Pintxos vascos, mariscos gallegos, cocina catalana y coctelería, todo en el mismo espacio. Espectacular en diseño y ambiente.',tags:['Gastronómico','Variado','Espectacular']},
      {name:'Parking Pizza',location:'Eixample esquerra, Carrer de Londres 98',badge:'badge-food',price:'mid',desc:'La mejor pizza de Barcelona según los italianos que viven en la ciudad. Masa fermentada 72 horas, ingredientes importados de Italia y horno de leña perfecto. Sin reserva, solo lista de espera.',tags:['Pizza','Italiana auténtica','Sin reserva']},
      {name:'Xiringuito Escribà',location:'Playa de Bogatell, Ronda del Litoral 42',badge:'badge-food',price:'high',desc:'El mejor chiringuito de playa de Barcelona, de la familia Escribà. Sus arroces con bogavante y la paella de marisco son excepcionales. Mesas frente al mar. Reserva obligatoria en verano.',tags:['Chiringuito','Arroces','Frente al mar']},
      {name:'Tickets (Albert Adrià)',location:'Eixample, Av. del Paral·lel 164',badge:'badge-food',price:'high',desc:'Bar de tapas de vanguardia del hermano de Ferran Adrià. Las aceitunas esféricas y el aire de tomate son icónicas. Reserva con 2 meses de anticipación — es casi imposible conseguir mesa de otro modo.',tags:['Alta cocina','Vanguardia','Reserva 2 meses antes']}
    ]},
    actividades:{tip:'La Sagrada Família y el Park Güell requieren reserva online con días de anticipación. El transporte público es excelente.',items:[
      {name:'Sagrada Família',location:'Eixample, Carrer de Mallorca 401',badge:'badge-activity',desc:'La obra maestra inacabada de Gaudí. Por dentro la luz que entra por los vitrales de colores es algo difícil de olvidar. Añade la visita a las torres para la mejor vista de la ciudad.',tags:['Arquitectura','Gaudí','Reserva online','€€']},
      {name:'Park Güell',location:'Gràcia, Carrer d\'Olot s/n',badge:'badge-activity',desc:'El parque de mosaicos de Gaudí en la colina de El Carmel. La zona monumental requiere ticket. El resto del parque es gratuito. Llega temprano para ver la ciudad antes de que se llene.',tags:['Gaudí','Vistas panorámicas','Mosaicos','€']},
      {name:'Barrio Gótico',location:'Ciutat Vella, centro histórico',badge:'badge-activity',desc:'El corazón medieval de Barcelona. La Catedral, la Plaza de Sant Jaume y los restos del templo romano de Augusto son los puntos clave. Perfecto para caminar sin rumbo y descubrir plazas escondidas.',tags:['Gratis','Historia','Caminata','Medieval']},
      {name:'La Pedrera (Casa Milà)',location:'Eixample, Passeig de Gràcia 92',badge:'badge-activity',desc:'El edificio modernista de Gaudí con el rooftop más fotogénico de la ciudad. Las chimeneas con forma de guerreros medievales son icónicas. Incluye exposición interior y piso de época restaurado.',tags:['Gaudí','Rooftop','Modernismo','€€']},
      {name:'Montserrat (excursión)',location:'1 hora desde Plaça Espanya (tren FGC)',badge:'badge-activity',desc:'La montaña sagrada de Cataluña, con un monasterio benedictino del siglo IX enclavado entre rocas impresionantes. Rutas de senderismo, funicular y vistas espectaculares. Sal antes de las 9h.',tags:['Excursión','Naturaleza','Monasterio','Senderismo']},
      {name:'Barrio del Born',location:'Ciutat Vella, alrededor del Passeig del Born',badge:'badge-activity',desc:'El barrio más cool de Barcelona. El Palau de la Música Catalana (UNESCO), el Mercat del Born con ruinas medievales y las mejores tiendas y bares de la ciudad en pocas manzanas.',tags:['Barrio','Palau de la Música','Ruinas medievales']},
      {name:'Cable car al Tibidabo',location:'Tibidabo, cima de la colina',badge:'badge-activity',desc:'El parque de atracciones más antiguo de España (1901) con vistas de 360° de Barcelona y el mar. La subida en funicular ya tiene su encanto.',tags:['Parque atracciones','€€€','Vistas 360°','Histórico']}
    ]},
    museos:{tip:'El primer domingo de cada mes muchos museos son gratuitos. Consulta horarios en la web de cada museo.',items:[
      {name:'Museu Picasso',location:'El Born, Carrer de Montcada 15–23',badge:'badge-museum',desc:'La colección de Picasso más importante del mundo, con más de 4.000 obras de sus primeros años en Barcelona. Los palacios medievales donde está ubicado son tan impresionantes como las obras.',tags:['Arte','Picasso','€€','Reserva online']},
      {name:'MACBA',location:'El Raval, Plaça dels Àngels 1',badge:'badge-museum',desc:'El museo de arte contemporáneo de Barcelona en un edificio blanco espectacular de Richard Meier. Colección permanente e internacional desde los años 50 hasta hoy.',tags:['Arte contemporáneo','€','Arquitectura']},
      {name:'Fundació Joan Miró',location:'Montjuïc, Parc de Montjuïc s/n',badge:'badge-museum',desc:'El museo de Joan Miró con más de 10.000 obras. El edificio de Sert es luminoso y perfecto para el arte. Combínalo con una visita al Castillo de Montjuïc.',tags:['Joan Miró','€€','Montjuïc']},
      {name:'MNAC',location:'Montjuïc, Palau Nacional',badge:'badge-museum',desc:'El palacio más imponente de Barcelona alberga la colección de arte románico más importante del mundo. La vista desde la escalinata hacia la ciudad y el mar es uno de los mejores panoramas de Barcelona.',tags:['Arte románico','€€','Palacio','Vistas']},
      {name:'CosmoCaixa',location:'Sarrià-Sant Gervasi, Carrer d\'Isaac Newton 26',badge:'badge-museum',desc:'El museo de ciencias más innovador de España, con el único bosque amazónico en un museo de Europa — 1.000 metros cuadrados de selva real con anacondas, caimanes y piranhas.',tags:['Ciencias','€€','Bosque amazónico','Planetario']},
      {name:'MUHBA (Historia de Barcelona)',location:'Barrio Gótico, Plaça del Rei s/n',badge:'badge-museum',desc:'Bajo la Plaza del Rey se esconden las ruinas de la Barcelona romana del siglo I — puedes caminar literalmente sobre una ciudad de 2.000 años. Uno de los yacimientos arqueológicos más importantes de Europa.',tags:['Historia','Roma antigua','€','Yacimiento arqueológico']}
    ]},
    comercio:{tip:'Las tiendas abren de 10h a 21h de lunes a sábado. El Paseo de Gracia es la zona premium; El Born tiene las mejores tiendas independientes.',items:[
      {name:'Paseo de Gracia',location:'Eixample, desde Plaça Catalunya hasta Diagonal',badge:'badge-shopping',desc:'El boulevard de lujo de Barcelona. Zara, Mango (flagship), Massimo Dutti, H&M, además de Hermès y Louis Vuitton. Las farolas y el pavimento son obra de Gaudí.',tags:['Lujo','Marcas internacionales','Mango flagship']},
      {name:'El Born (tiendas independientes)',location:'El Born, alrededor del Passeig del Born',badge:'badge-shopping',desc:'El mejor barrio para diseño local, moda independiente y tiendas únicas. Carrer del Rec y Carrer dels Flassaders concentran diseñadoras catalanas emergentes, vintage y joyería artesanal.',tags:['Diseño local','Vintage','Independiente']},
      {name:'Mercat de Sant Antoni',location:'Eixample esquerra, Carrer del Comte d\'Urgell 1',badge:'badge-shopping',desc:'Mercado modernista restaurado con el mejor mercado de segunda mano de Barcelona los domingos. El mercadillo de libros y comics del domingo es una institución.',tags:['Mercado','Segunda mano','Domingos','Libros']},
      {name:'El Triangle (Plaça Catalunya)',location:'Plaça Catalunya, centro',badge:'badge-shopping',desc:'El centro comercial más bien ubicado de Barcelona. FNAC (enorme), Sephora, Habitat y varias tiendas de moda. Perfecto si necesitas comprar varias cosas en un mismo sitio.',tags:['Centro comercial','FNAC','Céntrico','Variado']},
      {name:'Mercado de artesanía de la Catedral',location:'Barrio Gótico, frente a la Catedral',badge:'badge-shopping',desc:'Cada jueves se instalan puestos de artesanía frente a la Catedral de Barcelona. Joyería, cerámica, cuero y objetos únicos hechos a mano. El ambiente medieval del barrio Gótico de fondo es especial.',tags:['Artesanía','Jueves','Gratis','Gótico']}
    ]},
    discotheques:{tip:'Barcelona no empieza hasta las 2h de la madrugada. Los clubs cierran a las 5h–6h. Evita las filas reservando entradas online o llegando antes de la 1h. El Puerto Olímpico concentra los clubs de ambiente más internacional.',items:[
      {name:'Opium Barcelona',location:'Puerto Olímpico, Passeig Marítim de la Barceloneta 34',badge:'badge-disco',desc:'El club más famoso del Puerto Olímpico, frente al mar. Dos pisos con música house y comercial, terraza exterior y ambiente muy internacional. DJs residentes de nivel y noches temáticas los jueves y sábados. Perfecto para mezclar playa de noche con pista de baile.',tags:['Frente al mar','House','Internacional','Jueves y sábados']},
      {name:'CDLC (Carpe Diem Lounge Club)',location:'Puerto Olímpico, Passeig Marítim de la Barceloneta 32',badge:'badge-disco',desc:'El lounge-club más glamuroso del Puerto Olímpico, con camas balinesas en la terraza y vistas al mar. Música lounge y house de calidad. El ambiente es más sofisticado que Opium pero igual de animado. Perfecto para empezar la noche con una copa antes de seguir.',tags:['Lounge','Terraza marítima','Glamuroso','Sofisticado']},
      {name:'Razzmatazz',location:'Poblenou, Carrer dels Almogàvers 122',badge:'badge-disco',desc:'El mejor club de música alternativa de Barcelona, con 5 salas simultáneas con géneros distintos: indie, electrónica, techno, pop y rock. Capacidad para 5.000 personas. Los conciertos son de artistas internacionales de primer nivel. El club de los barceloneses reales.',tags:['5 salas','Indie','Electrónica','Conciertos']},
      {name:'Pacha Barcelona',location:'Puerto Olímpico, Passeig Marítim 38',badge:'badge-disco',desc:'La versión barcelonesa del club más famoso de Ibiza. Ambiente internacional, sesiones de DJs reconocidos y la calidad de la marca Pacha. Más exclusivo y caro que el resto del Puerto Olímpico, pero el nivel musical es consistentemente bueno.',tags:['Exclusivo','DJs internacionales','Marca Pacha','Puerto Olímpico']},
      {name:'Club Catwalk',location:'Puerto Olímpico, Carrer de la Marina 19–21',badge:'badge-disco',desc:'Club electrónico de referencia en Barcelona con una pista de baile espectacular y sonido de primer nivel. Techno, house y electrónica de calidad. Ambiente más underground que el Opium pero con la misma ubicación privilegiada cerca del mar.',tags:['Electrónica','Techno','Underground','Puerto Olímpico']},
      {name:'Sala Apolo',location:'El Raval, Carrer Nou de la Rambla 113',badge:'badge-disco',desc:'Una sala de conciertos y club histórico del Raval, en un teatro de los años 40 perfectamente conservado. Los viernes y sábados hay conciertos que terminan en sesión de DJ hasta el amanecer. El ambiente es alternativo y la decoración vintage es única.',tags:['Histórico','Conciertos','Alternativo','Raval']}
    ]},
    miradores:{tip:'El mejor momento para los miradores es el atardecer — el sol se pone hacia el mar desde Barcelona. Búnkers del Carmel es el más espectacular pero requiere subir a pie unos 20 minutos.',items:[
      {name:'Búnkers del Carmel',location:'El Carmel, Turó de la Rovira s/n',badge:'badge-mirador',desc:'La mejor vista de Barcelona sin discusión. Las ruinas de las baterías antiaéreas de la Guerra Civil en la cima del Turó de la Rovira ofrecen un panorama de 360° de la ciudad, el mar y el Tibidabo. Gratis, sin horarios y siempre lleno de gente local tomando cervezas al atardecer. El sitio más fotogénico de Barcelona.',tags:['Mejor vista 360°','Gratis','Atardecer','Guerra Civil']},
      {name:'Park Güell (terraza)',location:'Gràcia, Carrer d\'Olot s/n',badge:'badge-mirador',desc:'La terraza principal del Park Güell tiene una de las vistas más icónicas de Barcelona — la ciudad y el mar con el banco de mosaicos de Gaudí en primer plano. Requiere ticket para la zona monumental. El amanecer aquí, con la ciudad despertando, es mágico.',tags:['Gaudí','Mosaicos','Vista al mar','€']},
      {name:'Tibidabo',location:'Tibidabo, cima de la colina a 512m',badge:'badge-mirador',desc:'La cima más alta visible desde Barcelona, con vistas de hasta 70km en días claros. La iglesia del Sagrat Cor en lo alto y el parque de atracciones histórico son el entorno. La subida en funicular y tranvía azul ya es parte de la experiencia.',tags:['La más alta','70km de vistas','Funicular','Día claro']},
      {name:'Mirador del Migdia (Montjuïc)',location:'Montjuïc, Ctra. de Montjuïc s/n',badge:'badge-mirador',desc:'El mirador secreto de Montjuïc, en el lado opuesto al turístico. Vistas al puerto, al delta del Llobregat y al horizonte marino. La chiringuito informal que hay al lado sirve cervezas frías hasta el atardecer con música de fondo. El lugar favorito de los barceloneses que conocen Montjuïc de verdad.',tags:['Secreto','Vistas al puerto','Chiringuito','Local']},
      {name:'Torre de Collserola',location:'Serra de Collserola, carretera de Vallvidrera al Tibidabo',badge:'badge-mirador',desc:'La antena de telecomunicaciones de Norman Foster tiene una plataforma de observación a 560 metros. Vistas de 360° que en días claros llegan hasta Mallorca. Accesible desde el funicular de Vallvidrera. El mirador más alto de la ciudad.',tags:['Más alto de Barcelona','Norman Foster','360°','Hasta Mallorca']}
    ]}
  },

  madrid: {
    name:'Madrid',flag:'🇪🇸',country:'España',
    desc:'La capital de España es una ciudad que vive de noche y te sorprende de día. Con el mejor triángulo de museos de Europa, una cultura de tapas inigualable y una energía que no para, Madrid es de esas ciudades que siempre tienen algo más por ofrecer.',
    bestTime:'Abr–Jun, Sep–Nov',temp:'19°C verano',moneda:'Euro',idioma:'Español',
    playas:{tip:'Madrid no tiene playa, pero tiene el río Manzanares recuperado con playas urbanas en verano y está a solo 1h de la Sierra de Guadarrama con embalses increíbles.',items:[
      {name:'Madrid Río (playa urbana)',location:'Madrid Río, junto al río Manzanares',badge:'badge-beach',desc:'En verano el parque Madrid Río instala playas de arena con piscinas junto al río. Hamacas, zona de juegos, bares y música. El plan de playa de los madrileños que no salen de la ciudad.',tags:['Urbana','Gratis','Verano']},
      {name:'Embalse de Santillana',location:'Manzanares el Real, 50 min en coche',badge:'badge-beach',desc:'El embalse más bonito cerca de Madrid, con el Castillo de Manzanares el Real como telón de fondo. Aguas verdes entre montañas, zona de baño y senderismo.',tags:['Excursión','Embalse','Naturaleza']},
      {name:'El Espinar / La Losa (Sierra)',location:'1h en coche desde Madrid',badge:'badge-beach',desc:'Los pueblos de la Sierra de Guadarrama tienen ríos y pozas naturales de agua cristalina perfectas para el baño en verano. La Poza de las Ninfas en El Espinar es la más conocida.',tags:['Río','Naturaleza','Sierra']},
      {name:'Playa de Aranjuez',location:'Aranjuez, 45 min en tren Cercanías',badge:'badge-beach',desc:'El río Tajo a su paso por el Real Sitio de Aranjuez tiene zonas de baño naturales. Combínalo con la visita al Palacio Real y sus jardines.',tags:['Río','Palacio Real','Excursión día']},
      {name:'Embalse de El Atazar',location:'Sierra Norte de Madrid, 1h en coche',badge:'badge-beach',desc:'El embalse más espectacular de la Comunidad de Madrid. Aguas de color turquesa rodeadas de montañas y pueblos de piedra. Menos conocido que Santillana y mucho más tranquilo.',tags:['Turquesa','Tranquilo','Sierra Norte']}
    ]},
    restaurantes:{tip:'Madrid tiene una cultura de tapas gratis con la caña en algunos barrios. La cena no empieza antes de las 21h. Reserva en cualquier sitio medianamente famoso.',items:[
      {name:'El Brillante',location:'Centro, Plaza del Emperador Carlos V 8',badge:'badge-food',price:'cheap',desc:'El bocadillo de calamares más famoso de Madrid, frente al Reina Sofía. Calamares fritos en pan blanco con alioli. Sin reserva, sin espera. Un clásico absoluto.',tags:['Bocadillo calamares','Clásico','Sin reserva']},
      {name:'Bodega de la Ardosa',location:'Malasaña, Calle de Colón 13',badge:'badge-food',price:'cheap',desc:'Bar histórico de 1892 con las mejores patatas bravas de Madrid. Pequeño, de pie, con barriles de vino en las paredes. Uno de esos sitios que no ha cambiado en décadas.',tags:['Bar histórico','Patatas bravas','Auténtico']},
      {name:'Taberna Alhambra',location:'Sol, Calle de la Victoria 9',badge:'badge-food',price:'cheap',desc:'La taberna más auténtica del centro de Madrid, con azulejos sevillanos y tapas que no han cambiado desde los años 50. Boquerones en vinagre, pulpo a la gallega y jamón cortado a mano.',tags:['Taberna','Tapas clásicas','Centro']},
      {name:'Mercado de San Miguel',location:'Centro, Plaza de San Miguel s/n',badge:'badge-food',price:'mid',desc:'El mercado gourmet más bonito de Madrid, frente al Palacio Real. Ostras, jamón ibérico, vermut, pintxos y pasteles. Perfecto para el aperitivo o un desayuno especial.',tags:['Gourmet','Tapas','Aperitivo']},
      {name:'Casa Lucio',location:'La Latina, Cava Baja 35',badge:'badge-food',price:'mid',desc:'La institución de los huevos rotos en Madrid. Los reyes de España, actores y políticos comparten este comedor clásico desde 1974. Reserva con días de antelación.',tags:['Clásico','Huevos rotos','Institución madrileña']},
      {name:'Casa González',location:'Huertas, Calle del León 12',badge:'badge-food',price:'mid',desc:'Quesería, bodega y bar de vinos desde 1931. La selección de quesos españoles es excepcional, y los vinos por copa son de una calidad poco común. Ideal para un aperitivo o cena ligera de picoteo.',tags:['Quesos','Vinos','Desde 1931']},
      {name:'La Taberna de la Daniela',location:'Salamanca, Calle del General Pardiñas 21',badge:'badge-food',price:'high',desc:'El cocido madrileño más famoso de la ciudad. Se sirve en tres vuelcos como manda la tradición: sopa con fideos, garbanzos con verduras y finalmente las carnes.',tags:['Cocido madrileño','Tradicional']},
      {name:'Salmon Gurú',location:'Huertas, Calle del Echegaray 21',badge:'badge-food',price:'high',desc:'Elegido uno de los mejores bares de cócteles del mundo. Los cócteles de Diego Cabrera son obras de arte. Llega antes de las 20h si no quieres esperar.',tags:['Cócteles','Premiado','Noche']},
      {name:'DiverXO',location:'Tetuán, Calle de Padre Damián 23',badge:'badge-food',price:'high',desc:'Tres estrellas Michelin de David Muñoz. Un menú degustación que mezcla Asia, España y técnica de vanguardia en una experiencia de 3-4 horas. Reserva con 3 meses de anticipación.',tags:['3 estrellas Michelin','Reserva 3 meses antes']}
    ]},
    actividades:{tip:'El Parque del Retiro es enorme y precioso — mete al menos 2 horas. El Rastro solo existe los domingos por la mañana en La Latina.',items:[
      {name:'Parque del Retiro',location:'Retiro, Plaza de la Independencia s/n',badge:'badge-activity',desc:'El parque más querido de Madrid, 340 hectáreas en el centro. Alquila un bote en el estanque, visita el Palacio de Cristal (exposiciones gratuitas) y pasea entre estatuas. Los domingos hay músicos y artistas por todos lados.',tags:['Gratis','Imprescindible','Barca en el estanque']},
      {name:'El Rastro',location:'La Latina, Calle de la Ribera de Curtidores',badge:'badge-activity',desc:'El mercadillo más famoso de España, solo los domingos de 9h a 15h. Más de 3.500 puestos de ropa vintage, antigüedades, libros y vinilos. Después, La Latina se llena para el vermut dominical.',tags:['Solo domingos','Vintage','Mercadillo']},
      {name:'Palacio Real',location:'Centro, Calle de Bailén s/n',badge:'badge-activity',desc:'El palacio real más grande de Europa Occidental, con 3.418 habitaciones. La Sala del Trono, la Armería Real y los jardines de Sabatini son imprescindibles. El cambio de guardia (miércoles y sábados al mediodía) es espectacular.',tags:['Historia','€€','Cambio de guardia']},
      {name:'Barrio de Malasaña',location:'Centro, alrededor de la Plaza del Dos de Mayo',badge:'badge-activity',desc:'El barrio más hipster y bohemio de Madrid. Calles con murales, tiendas vintage, cafés de especialidad y bares que mezclan lo antiguo con lo nuevo.',tags:['Barrio','Alternativo','Murales']},
      {name:'Barrio de Chueca',location:'Centro',badge:'badge-activity',desc:'El barrio más cosmopolita y animado de Madrid. Restaurantes de todo tipo, tiendas de diseño, terrazas y la mejor vida nocturna del centro. La Plaza de Chueca es el epicentro.',tags:['Cosmopolita','Terrazas','Vida nocturna']},
      {name:'Templo de Debod',location:'Moncloa, Parque del Oeste',badge:'badge-activity',desc:'Un templo egipcio de 2.200 años trasladado piedra a piedra a Madrid. Completamente gratis. La terraza tiene la mejor vista del atardecer de Madrid — el sol se pone exactamente detrás de la Casa de Campo.',tags:['Gratis','Egipcio','Atardecer','Instagram']}
    ]},
    museos:{tip:'El Triángulo del Arte (Prado, Reina Sofía y Thyssen) está todo en el mismo paseo. Imposible verlos todos en un día — elige según tus gustos.',items:[
      {name:'Museo del Prado',location:'Retiro, Paseo del Prado s/n',badge:'badge-museum',desc:'Uno de los tres mejores museos del mundo. Velázquez, Goya, El Greco, Rubens y Tiziano en salas que te dejan sin palabras. Las Meninas y los cuadros negros de Goya son los imprescindibles. Gratis las últimas 2 horas del día.',tags:['Imprescindible','Velázquez','Goya','Gratis tarde']},
      {name:'Museo Reina Sofía',location:'Atocha, Calle de Santa Isabel 52',badge:'badge-museum',desc:'El museo de arte moderno español. El Guernica de Picasso es la pieza central — una sala entera dedicada a esa obra maestra. También tiene la mejor colección de Dalí y Miró fuera de sus propios museos.',tags:['Guernica','Picasso','Dalí']},
      {name:'Museo Thyssen-Bornemisza',location:'Centro, Paseo del Prado 8',badge:'badge-museum',desc:'La colección privada más grande de Europa. Cubre desde el siglo XIII hasta el arte pop americano, pasando por impresionistas y surrealistas. Lo que el Prado no tiene, lo tiene el Thyssen.',tags:['Impresionismo','Arte flamenco']},
      {name:'Museo Sorolla',location:'Almagro, Paseo del General Martínez Campos 37',badge:'badge-museum',desc:'La casa-estudio del pintor valenciano Joaquín Sorolla, conservada exactamente como él la dejó en 1923. Los jardines mediterráneos del interior son inesperadamente preciosos en el centro de Madrid.',tags:['Casa-museo','Sorolla','Jardines','€']},
      {name:'CaixaForum Madrid',location:'Retiro, Paseo del Prado 36',badge:'badge-museum',desc:'Espacio cultural en un edificio industrial transformado, con un jardín vertical de Patrick Blanc en la fachada. Las exposiciones temporales son siempre de primer nivel. Precio muy razonable.',tags:['Exposiciones temporales','€','Jardín vertical']}
    ]},
    comercio:{tip:'El Corte Inglés de Callao es el más grande de España. Para shopping de diseño, el Barrio de Salamanca es el equivalente madrileño al Paseo de Gràcia.',items:[
      {name:'Gran Vía',location:'Centro, desde Alcalá hasta Plaza de España',badge:'badge-shopping',desc:'La gran avenida comercial de Madrid. Zara, H&M, Primark (enorme), Mango y El Corte Inglés. Siempre llena de vida.',tags:['Marcas populares','Primark','Animada']},
      {name:'Barrio de Salamanca',location:'Salamanca, alrededor de Serrano y Jorge Juan',badge:'badge-shopping',desc:'El barrio más elegante de Madrid concentra el lujo: Loewe, Balenciaga, Carolina Herrera, Manolo Blahnik. Calle Serrano es la más exclusiva. Calle Jorge Juan tiene opciones más asequibles.',tags:['Lujo','Loewe','Diseño español']},
      {name:'El Rastro (mercadillo)',location:'La Latina, Ribera de Curtidores',badge:'badge-shopping',desc:'Solo los domingos 9h–15h. Más de 3.500 puestos. Ropa vintage, antigüedades, vinilos, libros, arte. Requiere paciencia pero los hallazgos pueden ser increíbles.',tags:['Solo domingos','Vintage','Antigüedades']},
      {name:'Mercado de Motores',location:'Arganzuela, Calle Méndez Álvaro s/n',badge:'badge-shopping',desc:'El mercado vintage más especial de Madrid, el segundo fin de semana de cada mes en el Museo del Ferrocarril. Antigüedades, diseño, moda vintage y gastronomía entre locomotoras antiguas.',tags:['2º fin de semana del mes','Antigüedades','Ferrocarril']}
    ]},
    discotheques:{tip:'La noche madrileña empieza tarde — los clubs no se llenan hasta las 2h–3h. El barrio de Chueca tiene los mejores bares para empezar antes de los clubs. Kapital es la experiencia más icónica.',items:[
      {name:'Kapital',location:'Retiro, Calle de Atocha 125',badge:'badge-disco',desc:'El club más famoso de Madrid, con 7 pisos y un ambiente diferente en cada uno: house, r&b, pop español, terraza, karaoke y más. Capacidad para 4.000 personas en un teatro del siglo XIX reconvertido. Turístico pero completamente impresionante. Los viernes y sábados son los mejores días.',tags:['7 pisos','Icónico','Viernes y sábados','Teatro histórico']},
      {name:'Lola Club',location:'Centro, Calle de la Reina 25',badge:'badge-disco',desc:'El club de moda del centro de Madrid, con una decoración de terciopelo y espejos que mezcla el glamour de los años 70 con el sonido más actual. House, disco y pop. Ambiente sofisticado y clientela joven y bien vestida. Lista de espera los fines de semana — reserva mesa.',tags:['Glamuroso','House','Disco','Reserva mesa']},
      {name:'Teatro Barceló',location:'Malasaña, Calle de Barceló 11',badge:'badge-disco',desc:'El club más elegante de Malasaña, en un antiguo teatro con palcos y galería. Los viernes tiene sesiones de electrónica de calidad y los sábados pop y house más comercial. El edificio en sí ya justifica la visita — la pista de baile en el escenario del teatro es espectacular.',tags:['Teatro histórico','Electrónica','Pop','Malasaña']},
      {name:'Mondo Disko',location:'Legazpi, Calle del Doctor Fourquet 33',badge:'badge-disco',desc:'La sala de referencia para la música disco, funk y boogie de calidad en Madrid. Ambiente underground y sin postureo. El espacio es pequeño y íntimo, con una colección de discos de vinilo en las paredes. Los DJs residentes son los mejores seleccionadores de la ciudad.',tags:['Disco','Funk','Vinilo','Underground']},
      {name:'Fabrik',location:'Humanes de Madrid, Av. de la Industria 82',badge:'badge-disco',desc:'El club de música electrónica más grande de España, a 30 minutos de Madrid en taxi o autobús nocturno. Capacidad para 15.000 personas en una antigua fábrica. DJs internacionales de primer nivel cada fin de semana. La experiencia de techno y house más completa de España.',tags:['Más grande de España','Techno','15.000 personas','DJs internacionales']}
    ]},
    miradores:{tip:'El atardecer sobre Madrid desde el Templo de Debod es el más fotogénico. Para el mejor panorama general, sube a las azoteas del CaixaForum o al Círculo de Bellas Artes.',items:[
      {name:'Templo de Debod',location:'Moncloa, Parque del Oeste',badge:'badge-mirador',desc:'La terraza alrededor del templo egipcio tiene la vista de atardecer más espectacular de Madrid. El sol se pone exactamente hacia la Casa de Campo y el cielo se llena de colores. El sitio más fotografiado de Madrid al atardecer. Completamente gratis.',tags:['Mejor atardecer','Gratis','Templo egipcio','Instagram']},
      {name:'Azotea del Círculo de Bellas Artes',location:'Centro, Calle de Alcalá 42',badge:'badge-mirador',desc:'La azotea más icónica de Madrid, con vista de 360° sobre los tejados y el skyline del centro. El Palacio de Comunicaciones, la Puerta de Alcalá y la Sierra de Guadarrama al fondo. Una copa en la barra de la azotea mientras el sol se pone es una experiencia de Madrid imprescindible.',tags:['360°','€ entrada','Skyline Madrid','Copa con vistas']},
      {name:'Faro de Moncloa',location:'Moncloa, Avenida de la Memoria s/n',badge:'badge-mirador',desc:'La torre de telecomunicaciones de Sáenz de Oíza tiene una plataforma de observación a 92 metros con vistas impresionantes hacia la Sierra de Guadarrama y toda la ciudad. Las vistas al oeste (puesta de sol sobre la Sierra) son espectaculares. Precio muy razonable.',tags:['92 metros','Sierra Guadarrama','€','Puesta de sol al oeste']},
      {name:'Mirador del Retiro (Colina de los Chopos)',location:'Retiro, dentro del parque',badge:'badge-mirador',desc:'El punto más alto del Parque del Retiro ofrece una vista panorámica sobre el parque y la ciudad al fondo. Desde aquí se ve perfectamente la alineación del Paseo del Prado con el Prado, el Reina Sofía y el Thyssen. Completamente gratis y sin turistas masivos.',tags:['Gratis','Dentro del Retiro','Sin masas']},
      {name:'Azotea del Hotel Gran Vía (Vincci)](https://www.vinccihoteles.com)',location:'Gran Vía, Calle de la Montera 47',badge:'badge-mirador',desc:'La terraza del hotel Vincci sobre la Gran Vía tiene las mejores vistas del bulevar más famoso de Madrid — ves los edificios art déco desde arriba, con el Edificio Metrópolis justo enfrente. Paga la copa y tienes acceso. Imprescindible para una foto única de Madrid.',tags:['Gran Vía desde arriba','Copa con vistas','Edificio Metrópolis','Art Déco']}
    ]}
  },

  roma: {
    name:'Roma',flag:'🇮🇹',country:'Italia',
    desc:'La Ciudad Eterna tiene 2.800 años de historia en cada esquina. La combinación de ruinas antiguas, arte renacentista, comida increíble y el caos romano hacen de Roma una experiencia única e irrepetible.',
    bestTime:'Abr–Jun, Sep–Oct',temp:'20°C verano',moneda:'Euro',idioma:'Italiano',
    playas:{tip:'Roma no tiene playa propia pero Ostia está a 30 minutos en tren. Para algo más bonito, Sperlonga o Sabaudia requieren coche pero valen la pena.',items:[
      {name:'Lido di Ostia',location:'30 min en tren desde Roma Termini',badge:'badge-beach',desc:'La playa de los romanos, a 30 minutos en tren directo. No es la playa más bonita de Italia, pero cumple perfectamente. Hay playas libres (gratis) y estabilimenti (pago, con hamacas). Ambiente completamente local.',tags:['30 min desde Roma','Fácil acceso','Local']},
      {name:'Sperlonga',location:'1h30 en coche o autobús desde Roma',badge:'badge-beach',desc:'El secreto mejor guardado cerca de Roma. Un pueblo blanco encima de una colina con una playa larga de arena blanca y aguas cristalinas. El pueblo medieval sobre el acantilado es precioso.',tags:['Excursión','Aguas cristalinas','Pueblo medieval']},
      {name:'Sabaudia (Parco del Circeo)',location:'1h30 en coche desde Roma',badge:'badge-beach',desc:'Una de las playas más bonitas del Lazio, dentro de un parque nacional. Dunas de arena, agua verde esmeralda y una laguna protegida. Sin masificación turística.',tags:['Parque nacional','Dunas','Sin masificación']},
      {name:'Santa Marinella',location:'1h en tren desde Roma Termini',badge:'badge-beach',desc:'La escapada de playa más fácil desde Roma en tren. Pueblo marinero con playa de arena oscura volcánica, un castillo medieval en el promontorio y restaurantes de marisco en el puerto.',tags:['1h en tren','Castillo medieval','Marisco']}
    ]},
    restaurantes:{tip:'Evita los restaurantes con menú en 10 idiomas en la puerta. Los mejores sitios tienen menú escrito a mano y solo en italiano. La carbonara NUNCA lleva nata.',items:[
      {name:'Bar San Calisto',location:'Trastevere, Piazza di San Calisto 4',badge:'badge-food',price:'cheap',desc:'El bar más auténtico del Trastevere. El cappuccino de la mañana cuesta 1€, las bebidas son baratas y el ambiente es puro Roma de barrio. Una visita cultural imprescindible.',tags:['Cappuccino','Auténtico','Sin pretensiones']},
      {name:'Supplì Roma',location:'Trastevere, Via di San Francesco a Ripa 137',badge:'badge-food',price:'cheap',desc:'Los mejores supplì (croquetas de arroz con ragù y mozzarella fundida) de Roma. Crujientes por fuera, cremosos por dentro con el queso que se estira. Cola siempre pero avanza rápido.',tags:['Supplì','Callejero','Trastevere']},
      {name:'Pizzarium (Bonci)',location:'Prati, Via della Meloria 43',badge:'badge-food',price:'cheap',desc:'La pizza al taglio más famosa del mundo. Masa madre y combinaciones que van mucho más allá de la margherita clásica. Pagas por peso, comes de pie. Cerca del Vaticano.',tags:['Pizza al taglio','De pie','Cerca del Vaticano']},
      {name:'Da Enzo al 29',location:'Trastevere, Via dei Vascellari 29',badge:'badge-food',price:'mid',desc:'La trattoria más auténtica del Trastevere. Familiar, pequeña y sin concesiones turísticas. Cacio e pepe, carbonara y amatriciana entre las mejores de Roma. Reserva con al menos 2 días.',tags:['Auténtico','Pasta romana','Reserva obligatoria']},
      {name:'Osteria dell\'Angelo',location:'Prati, Via Giuseppe Bettolo 24',badge:'badge-food',price:'mid',desc:'La ostería más auténtica del barrio de Prati, con menú fijo que cambia cada día según el mercado. Los jueves: gnocchi al ragù. Los viernes: bacalà. Reserva obligatoria.',tags:['Menú del día','Gnocchi jueves','Bacalà viernes']},
      {name:'Roscioli',location:'Campo de\' Fiori, Via dei Giubbonari 21',badge:'badge-food',price:'high',desc:'Mitad salumería, mitad restaurante de alta calidad. La mejor selección de jamones y quesos italianos, más una pasta carbonara que muchos consideran la mejor de Roma. Vinos excepcionales.',tags:['Salumería','Carbonara','Vinos']},
      {name:'Il Sorpasso',location:'Prati, Via Properzio 31',badge:'badge-food',price:'high',desc:'El aperitivo más elegante de Roma en Prati. De 18h a 21h sirven un buffet de embutidos y quesos incluido con la copa. La carta de vinos naturales es de las mejores de la ciudad.',tags:['Aperitivo','Vinos naturales','Prati']}
    ]},
    actividades:{tip:'El Coliseo, los Museos Vaticanos y la Galería Borghese requieren reserva online OBLIGATORIA en temporada alta. El metro de Roma tiene solo 2 líneas — muchos sitios se llegan mejor a pie.',items:[
      {name:'Coliseo + Foro Romano + Palatino',location:'Centro histórico, Piazza del Colosseo',badge:'badge-activity',desc:'El anfiteatro más famoso del mundo y las ruinas del corazón del Imperio Romano, todo en el mismo ticket combinado. El Foro Romano es caminar literalmente sobre los cimientos de la civilización occidental.',tags:['Imprescindible','Reserva online','€€','Ticket combinado']},
      {name:'Vaticano y Plaza de San Pedro',location:'Vaticano',badge:'badge-activity',desc:'La Plaza de San Pedro de Bernini es una de las obras arquitectónicas más impresionantes jamás construidas. El miércoles el Papa da audiencia pública gratis. La Basílica de San Pedro es gratuita.',tags:['Basílica gratis','Audiencia papal miércoles']},
      {name:'Trastevere (barrio)',location:'Trastevere, al otro lado del Tíber',badge:'badge-activity',desc:'El barrio más romántico y auténtico de Roma. Callejuelas de adoquines, casas con hiedra, plazas con fuentes y una vida de barrio que el centro ha perdido. De noche se llena de vida.',tags:['Gratis','Romántico','Fotogénico','Noche animada']},
      {name:'Piazza Navona',location:'Centro histórico',badge:'badge-activity',desc:'La plaza más elegante de Roma, construida sobre un estadio romano del siglo I. Las tres fuentes de Bernini son obras maestras del barroco. Artistas callejeros y atmósfera única. Gratis.',tags:['Gratis','Bernini','Artistas callejeros']},
      {name:'Mercato di Porta Portese',location:'Trastevere, Via Portuense',badge:'badge-activity',desc:'El mercado de pulgas más grande de Roma, solo los domingos de 7h a 14h. Miles de puestos con antigüedades, ropa vintage, libros y objetos extraños. Ojo con los carteristas.',tags:['Solo domingos','Pulgas','Vintage']}
    ]},
    museos:{tip:'Los Museos Vaticanos son los más visitados del mundo — reserva con al menos una semana de antelación. La Galería Borghese solo permite 360 personas a la vez.',items:[
      {name:'Museos Vaticanos + Capilla Sixtina',location:'Vaticano, Viale Vaticano',badge:'badge-museum',desc:'La mayor colección de arte del mundo, culminando en la Capilla Sixtina de Miguel Ángel. El techo — La Creación de Adán — es la imagen más reproducida del Renacimiento. Reserva online obligatoria.',tags:['Imprescindible','Reserva obligatoria','€€€','Miguel Ángel']},
      {name:'Galería Borghese',location:'Villa Borghese, Piazzale Scipione Borghese 5',badge:'badge-museum',desc:'Las esculturas de Bernini (Apolo y Dafne, El Rapto de Proserpina) son de una perfección técnica sobrenatural. Solo 360 personas por turno de 2 horas. Reserva con semanas de antelación.',tags:['Bernini','Reserva muy anticipada','€€']},
      {name:'Palazzo Massimo',location:'Termini, Largo di Villa Peretti 2',badge:'badge-museum',desc:'El mejor museo de arte romano clásico de Roma y el menos visitado. Los frescos romanos del siglo I y los mosaicos están perfectamente conservados. Sin colas, sin masificación.',tags:['Arte romano','€','Sin colas','Poco conocido']},
      {name:'Musei Capitolini',location:'Capitolio, Piazza del Campidoglio 1',badge:'badge-museum',desc:'Los museos más antiguos del mundo (fundados en 1471). La estatua ecuestre de Marco Aurelio y la Lupa Capitolina son las piezas estrella. Las vistas al Foro Romano desde la terraza son las mejores de Roma.',tags:['Los más antiguos del mundo','€€','Vistas al Foro']}
    ]},
    comercio:{tip:'Roma no es la mejor ciudad de Italia para compras — Milán gana ese título. Pero tiene cosas únicas: el barrio Monti para diseño independiente y los mejores mercados de pulgas.',items:[
      {name:'Via Condotti y alrededores',location:'Spagna, Via Condotti',badge:'badge-shopping',desc:'La calle de lujo de Roma, saliendo de la Plaza de España. Gucci, Prada, Louis Vuitton, Valentino y las grandes casas italianas. Aunque no compres, pasear por el Tridente es un placer visual.',tags:['Lujo','Diseñadores italianos','Tridente']},
      {name:'Barrio Monti (tiendas)',location:'Monti, entre el Coliseo y Termini',badge:'badge-shopping',desc:'El barrio más hip de Roma. Tiendas de diseño independiente, estudios de artistas y librerías especializadas en calles adoquinadas. La Via del Boschetto y Via Urbana concentran lo mejor.',tags:['Hip','Independiente','Via Urbana']},
      {name:'Mercato Monti',location:'Monti, Via Leonina 46',badge:'badge-shopping',desc:'El mercado de diseño y vintage más cool de Roma, los fines de semana. Diseñadores locales emergentes, ropa vintage cuidada, joyería artesanal. El barrio de Monti alrededor es el más bohemio de Roma.',tags:['Fines de semana','Diseño local','Vintage']},
      {name:'Porta Portese (mercadillo)',location:'Trastevere, Via Portuense',badge:'badge-shopping',desc:'El mercadillo de pulgas más grande de Roma, solo los domingos de 7h a 14h. Antigüedades, ropa vintage, libros y objetos extraños. Un clásico romano que no ha cambiado en décadas.',tags:['Solo domingos','Antigüedades','Vintage']}
    ]},
    discotheques:{tip:'Roma no tiene la escena nocturna de Ibiza o Barcelona, pero en verano los clubs al aire libre junto al Tíber son únicos. La zona de Testaccio concentra los mejores clubs.',items:[
      {name:'Goa Club',location:'Ostiense, Via Giuseppe Libetta 13',badge:'badge-disco',desc:'El club de referencia para música electrónica en Roma, en el barrio de Ostiense. Techno y house de calidad con DJs internacionales de primer nivel. Espacio industrial reconvertido con una pista de baile espectacular y un sonido excepcional. El favorito de los romanos que entienden de música.',tags:['Electrónica','Techno','DJs internacionales','Industrial']},
      {name:'Akab Club',location:'Testaccio, Via di Monte Testaccio 68',badge:'badge-disco',desc:'El club más animado del barrio de Testaccio, el barrio de la noche romana. Música que mezcla house, funk y pop en un espacio de dos pisos. El ambiente es de romanos reales, sin postureo turístico. La terraza del primer piso en verano es perfecta.',tags:['Testaccio','House','Funk','Local']},
      {name:'Piper Club',location:'Salario, Via Tagliamento 9',badge:'badge-disco',desc:'El club más histórico de Roma, abierto desde 1965. Aquí tocaron los Beatles, Led Zeppelin y los Rolling Stones. Hoy tiene noches temáticas de pop, retro y dance que lo mantienen lleno de gente. Una visita a la historia de la noche romana.',tags:['Histórico','Desde 1965','Pop','Retro']},
      {name:'Shari Vari Playhouse',location:'Flaminio, Via Flaminia 30',badge:'badge-disco',desc:'El club más sofisticado de Roma, en el barrio del MAXXI (Museo de Arte del Siglo XXI). Tres espacios con música electrónica, house y techno de calidad. Ambiente de diseño y clientela internacional. DJs europeos de primera línea los fines de semana.',tags:['Sofisticado','Electrónica','Flaminio','Internacional']},
      {name:'Lanificio 159',location:'Pietralata, Via Pietralata 159',badge:'badge-disco',desc:'Una antigua fábrica de lana reconvertida en espacio cultural y club, al norte de Roma. Conciertos, exposiciones de arte y sesiones de DJ en un espacio enorme con jardín exterior. El ambiente más alternativo y underground de Roma, frecuentado por artistas y estudiantes de diseño.',tags:['Alternativo','Fábrica reconvertida','Jardín exterior','Underground']}
    ]},
    miradores:{tip:'El Gianicolo tiene la mejor vista general de Roma. La Terraza Pinciana en los jardines de Villa Borghese es la más tranquila y menos conocida.',items:[
      {name:'Gianicolo (Terraza del Gianicolo)',location:'Gianicolo, colina sobre Trastevere',badge:'badge-mirador',desc:'La colina del Gianicolo tiene el mejor panorama de Roma — 180° sobre los tejados rojos, las cúpulas y el Vaticano al fondo. Todos los días a mediodía disparan un cañonazo histórico que se escucha en toda la ciudad (tradición desde 1847). Completamente gratis y sin masificación.',tags:['Mejor vista de Roma','Gratis','Cañonazo mediodía','Vaticano al fondo']},
      {name:'Terraza del Vittoriano',location:'Centro histórico, Piazza Venezia',badge:'badge-mirador',desc:'La terraza en lo alto del enorme monumento blanco de la Piazza Venezia ofrece una de las vistas más completas de Roma: el Foro Romano, el Coliseo, los Foros Imperiales y los tejados del centro histórico. Ascensor panorámico de pago, pero vale cada euro.',tags:['Foro Romano desde arriba','€ ascensor','Coliseo','Centro histórico']},
      {name:'Pincio (jardines de Villa Borghese)',location:'Flaminio, Viale della Trinità dei Monti',badge:'badge-mirador',desc:'El jardín más romántico de Roma, sobre la Piazza del Popolo. Desde el mirador del Pincio se ve perfectamente la cúpula de San Pedro al fondo, los tejados del centro y el río Tíber. El atardecer aquí es de los más tranquilos de Roma. Completamente gratis.',tags:['Gratis','Romántico','San Pedro al fondo','Tranquilo']},
      {name:'Terraza de Trinità dei Monti (Scalinata)',location:'Spagna, Piazza di Spagna',badge:'badge-mirador',desc:'La escalinata de la Plaza de España sube hasta la iglesia de Trinità dei Monti, desde donde hay una vista espectacular de la Via Condotti y la Via del Corso cortando Roma hasta el Tíber. El mirador más accesible y céntrico de Roma. Gratis.',tags:['Gratis','Plaza de España','Céntrico','Via Condotti']},
      {name:'Cúpula de San Pedro',location:'Vaticano, Basílica de San Pedro',badge:'badge-mirador',desc:'La cúpula de Miguel Ángel a 136 metros de altura ofrece la vista más espiritual de Roma — el círculo perfecto de la Plaza de San Pedro abajo, y la ciudad extendiéndose hasta el horizonte. Hay ascensor (más caro) o subida a pie por las 551 escaleras (más barato y más épico).',tags:['136 metros','Miguel Ángel','€','Ascensor o escaleras']}
    ]}
  },

  mallorca: {
    name:'Mallorca',flag:'🇪🇸',country:'España',
    desc:'La isla mediterránea perfecta: calas con agua turquesa entre pinos y acantilados, gastronomía mallorquina de calidad, una capital preciosa y una vida nocturna que va desde el chiringuito familiar hasta el club internacional.',
    bestTime:'May–Oct',temp:'24°C verano',moneda:'Euro',idioma:'Español / Catalán',
    playas:{tip:'Para las calas del norte (Formentor, Cala Mesquida) necesitas coche o moto. Alquila con antelación en verano. Las mejores calas se llenan antes de las 10h en julio y agosto.',items:[
      {name:'Cala Formentor',location:'Formentor, norte de la isla, 1h desde Palma en coche',badge:'badge-beach',desc:'La cala más espectacular de Mallorca. Agua turquesa profunda entre acantilados de pinos y montañas. El aparcamiento se llena antes de las 9h en verano — usa el bus desde Puerto Pollença.',tags:['La más espectacular','Bus desde Pto Pollença','Llega temprano']},
      {name:'Cala Deiá',location:'Deià, noroeste de la isla',badge:'badge-beach',desc:'Cala escondida debajo del pueblo más bonito de Mallorca. Roca, agua cristalísima y ambiente íntimo. Encima está el restaurante Ca\'s Patro March.',tags:['Íntima','Agua cristalina','Ca\'s Patro March']},
      {name:'Caló des Moro',location:'Santanyí, sureste de la isla',badge:'badge-beach',desc:'La cala más fotografiada de Mallorca — pequeñísima, redonda perfecta, con agua azul brillante y rodeada de acantilados blancos. Solo caben unas 50 personas. En verano la cola para bajar empieza antes de las 8h.',tags:['La más fotografiada','Pequeña','Madrugar']},
      {name:'Playa de Muro',location:'Norte de la isla (Alcúdia)',badge:'badge-beach',desc:'La playa de arena más larga y fina de Mallorca, 16km continuos dentro del Parque Natural de S\'Albufera. Aguas poco profundas y perfectas.',tags:['La más larga','Arena fina','Parque natural']},
      {name:'Cala Mondragó',location:'Santanyí, Parque Natural Mondragó',badge:'badge-beach',desc:'Dos calas pequeñas dentro de un parque natural protegido. Pinos hasta el agua, arena blanca y sin construcciones alrededor.',tags:['Parque natural','Sin edificios','Doble cala']},
      {name:'Cala Agulla',location:'Capdepera, noreste de la isla',badge:'badge-beach',desc:'Una de las playas más grandes y bonitas del noreste, dentro de una zona protegida con pinos hasta el agua. Arena dorada fina y aguas turquesas. Menos masificada que las calas del sur.',tags:['Arena dorada','Pinos','Noreste']},
      {name:'Cala Varques',location:'Manacor, este de la isla',badge:'badge-beach',desc:'La cala virgen más famosa de Mallorca — solo accesible a pie (30 min de camino). Sin servicios, sin chiringuito. Solo rocas, pinos, agua cristalina y los que se molestan en llegar.',tags:['30 min a pie','Virgen','Sin servicios']}
    ]},
    restaurantes:{tip:'La gastronomía mallorquina es de las mejores de España. No te vayas sin probar: pa amb oli, ensaimada, frito mallorquín y arroz brut.',items:[
      {name:'Fornet de la Soca',location:'Palma, Carrer de la Puresa 4',badge:'badge-food',price:'cheap',desc:'La mejor pastelería tradicional de Palma. Las ensaimadas son extraordinarias — de llisona, de sobrasada, de cabell d\'àngel. Para desayunar como un mallorquín de verdad.',tags:['Ensaimadas','Desayuno','Tradicional']},
      {name:'Celler Sa Premsa',location:'Palma, Plaça Bisbe Berenguer de Palou 8',badge:'badge-food',price:'cheap',desc:'La bodega-restaurante más clásica de Palma desde 1958. Barricas de vino en las paredes, cocina mallorquina tradicional: frito mallorquín, arròs brut y pa amb oli.',tags:['Clásico','Mallorquín','Desde 1958']},
      {name:'Misa Brasería',location:'Palma, Carrer de Can Maçanet 6',badge:'badge-food',price:'mid',desc:'El restaurante más de moda de Palma. Cocina de brasas con producto local — la gamba roja, el cerdo negro y las verduras de temporada son los protagonistas. Ambiente moderno en edificio histórico.',tags:['Moderno','Brasas','De moda']},
      {name:'Vaca Roja',location:'Port de Pollença',badge:'badge-food',price:'mid',desc:'El mejor restaurante de mariscos y arroces del norte de la isla. La caldereta de langosta y el arroz de gamba roja son los platos por los que vale el viaje.',tags:['Mariscos','Caldereta langosta','Puerto pesquero']},
      {name:'Ca\'s Patro March',location:'Cala Deiá, Deià',badge:'badge-food',price:'high',desc:'El restaurante más fotogénico e icónico de Mallorca, al borde del agua. Arroces con marisco y langosta y pescado de lonja. Reserva con al menos un mes de anticipación en verano.',tags:['Icónico','Arroces','Reserva 1 mes antes']},
      {name:'Bon Lloc',location:'Palma, Carrer de Sant Feliu 7',badge:'badge-food',price:'high',desc:'El mejor restaurante vegetariano de Mallorca con una estrella Michelin. Los productos de la huerta mallorquina elevados a otra dimensión. En una casa señorial del siglo XVI en el centro de Palma.',tags:['Vegetariano','1 estrella Michelin','Palma histórica']}
    ]},
    actividades:{tip:'La Serra de Tramuntana (Patrimonio UNESCO) tiene algunas de las carreteras con más vistas de España.',items:[
      {name:'Serra de Tramuntana',location:'Norte y oeste de la isla',badge:'badge-activity',desc:'La cadena montañosa Patrimonio Mundial UNESCO. La carretera de Andratx a Pollença por Valldemossa, Deià y Sóller es uno de los recorridos en coche más espectaculares de Europa.',tags:['Patrimonio UNESCO','Coche necesario','Carretera espectacular']},
      {name:'Valldemossa',location:'Serra de Tramuntana, 17km de Palma',badge:'badge-activity',desc:'El pueblo más bonito de Mallorca, donde Chopin y George Sand pasaron el invierno de 1838. El Real Cartuja conserva la celda donde Chopin compuso sus Preludios.',tags:['Chopin','Cartuja','Pueblo más bonito']},
      {name:'Sóller y el tren de madera',location:'Sóller, 30km de Palma',badge:'badge-activity',desc:'El tren vintage de madera de 1912 que va de Palma a Sóller a través de la sierra es una experiencia en sí misma. El pueblo es precioso rodeado de naranjos.',tags:['Tren vintage','Naranjos','€€']},
      {name:'Coves del Drac',location:'Porto Cristo, este de la isla',badge:'badge-activity',desc:'Las cuevas más espectaculares de Mallorca, con el lago subterráneo navegable más grande del mundo. El concierto de música clásica sobre el lago al final de la visita es algo único en el mundo. Reserva online.',tags:['Cuevas','Lago subterráneo','Concierto en el lago']},
      {name:'Cap de Formentor (mirador)',location:'Punta norte de la isla',badge:'badge-activity',desc:'El extremo norte de Mallorca, con acantilados de 200 metros sobre el mar y vistas hasta Menorca en días claros. La carretera que llega es de las más emocionantes de España.',tags:['Acantilados','Faro','Vistas hasta Menorca']}
    ]},
    museos:{tip:'Mallorca no es un destino de museos pero tiene joyas interesantes — la Fundació Pilar i Joan Miró es la más especial.',items:[
      {name:'Fundació Pilar i Joan Miró',location:'Palma, Carrer de Joan de Saridakis 29',badge:'badge-museum',desc:'El estudio-museo donde Joan Miró vivió y trabajó los últimos 27 años de su vida. El taller se conserva exactamente como lo dejó — con los colores, los pinceles y los bocetos sobre la mesa.',tags:['Miró','Estudio original','€€']},
      {name:'Es Baluard',location:'Palma, Plaça de la Porta de Santa Catalina 10',badge:'badge-museum',desc:'El museo de arte contemporáneo de Palma, dentro de una muralla renacentista del siglo XVI con vistas al puerto. Colección permanente con Miró, Picasso y Barceló.',tags:['Arte contemporáneo','Murallas renacentistas','Vistas al puerto']},
      {name:'Museu Fundació Juan March',location:'Palma, Carrer de Sant Miquel 11',badge:'badge-museum',desc:'Colección de arte español del siglo XX centrada en Picasso, Miró, Dalí y Saura. En el palacio de Can Gallard del Canyar del siglo XVII. Completamente gratuito.',tags:['Gratis','Picasso','Dalí','Miró']}
    ]},
    comercio:{tip:'Los mercados locales de los pueblos son la mejor experiencia de compras en Mallorca: Sineu (miércoles), Alcúdia (martes y domingos), Pollença (domingos).',items:[
      {name:'Passeig del Born (Palma)',location:'Palma, Passeig del Born',badge:'badge-shopping',desc:'El boulevard elegante de Palma con Zara, Massimo Dutti, Loewe y marcas locales. El ambiente es relajado y perfecto para combinar compras con un café en terraza.',tags:['Paseo','Marcas conocidas','Terrazas']},
      {name:'Mercat de l\'Olivar',location:'Palma, Plaça de l\'Olivar 4',badge:'badge-shopping',desc:'El mercado municipal de Palma con los mejores productos de la isla: ensaimadas, sobrasada, queso mahonés, aceitunas y pescado fresco. Abierto de lunes a sábado por la mañana.',tags:['Mercado','Productos locales','Sobrasada']},
      {name:'Mercadillo de Sineu (miércoles)',location:'Sineu, centro de la isla',badge:'badge-shopping',desc:'El mercado semanal más auténtico de Mallorca. Miércoles por la mañana. Animales de granja, productos agrícolas, ropa, cerámica y artesanía local.',tags:['Solo miércoles','Auténtico','Artesanía']},
      {name:'Gordiola (vidrio artesanal)',location:'Algaida, Carretera Palma-Manacor km 19',badge:'badge-shopping',desc:'La fábrica de vidrio artesanal más antigua de Mallorca (1719) sigue produciendo piezas sopladas a mano. Se puede ver a los artesanos trabajar y comprar directamente.',tags:['Artesanía','Vidrio soplado','Fábrica visitable']}
    ]},
    discotheques:{tip:'La vida nocturna de Mallorca se concentra en la zona de Magaluf y el Puerto de Alcúdia en el norte. Pacha Mallorca es el más icónico. En Palma hay opciones más tranquilas.',items:[
      {name:'Pacha Mallorca',location:'Palma, Passeig Marítim 42',badge:'badge-disco',desc:'El club más icónico de Mallorca, en el paseo marítimo de Palma. La marca Pacha garantiza calidad en los DJs y un ambiente internacional de primer nivel. Los viernes de verano son los mejores. Más sofisticado y menos desmadre que los clubs de Magaluf.',tags:['Icónico','Paseo Marítim','DJs internacionales','Viernes']},
      {name:'BCM Planet Dance',location:'Magaluf, Avinguda S\'Olivera 1',badge:'badge-disco',desc:'El superclub más famoso de Mallorca, con una pista principal para 5.000 personas y un sonido y producción de nivel europeo. Música house y comercial. El ambiente es joven e internacional — es el club de las vacaciones de verano europeas por excelencia.',tags:['5.000 personas','House','Magaluf','Vacaciones europeas']},
      {name:'Tito\'s Mallorca',location:'Palma, Passeig Marítim 3',badge:'badge-disco',desc:'El club de Palma con más historia, abierto desde los años 50. Vistas al mar desde la terraza y un ascensor panorámico que baja desde el Paseo Marítimo hasta el nivel del club. Música variada y ambiente mixto. Ideal para una noche en Palma sin tener que ir a Magaluf.',tags:['Histórico','Terraza al mar','Ascensor panorámico','Palma']},
      {name:'Bora Bora Ibiza Beach Club',location:'El Arenal, Platja de Palma',badge:'badge-disco',desc:'El chiringuito-club más famoso de la Platja de Palma, con música electrónica desde las 4 de la tarde hasta bien entrada la noche. Ambiente de playa de día que se convierte en pista de baile al atardecer. El lugar más informal y divertido de la isla para el after-beach.',tags:['Beach club','After-beach','Electrónica','Platja de Palma']}
    ]},
    miradores:{tip:'Los miradores de la Serra de Tramuntana son los más espectaculares de la isla. La carretera de Sóller a Pollença es un mirador continuo.',items:[
      {name:'Cap de Formentor',location:'Punta norte de la isla, 1h30 desde Palma',badge:'badge-mirador',desc:'El mirador más impresionante de Mallorca, en el faro del extremo norte de la isla. Acantilados de 200 metros sobre el Mediterráneo con vistas hasta Menorca en días claros. La carretera para llegar es de las más emocionantes de España — curvas sobre el vacío.',tags:['El más espectacular','Acantilados 200m','Vistas hasta Menorca','Faro']},

let currentCity='barcelona';
let currentCat='playas';
let currentPrice='all';

function renderCityPills(){
  const c=document.getElementById('cityPills');
  c.innerHTML='';
  Object.keys(data).forEach(id=>{
    const city=data[id];
    const pill=document.createElement('div');
    pill.className='city-pill'+(id===currentCity?' active':'');
    pill.textContent=city.flag+' '+city.name;
    pill.onclick=()=>{currentCity=id;currentPrice='all';render();};
    c.appendChild(pill);
  });
}

function renderCityIntro(){
  const city=data[currentCity];
  document.getElementById('cityIntro').innerHTML=`
    <div class="city-flag">${city.flag}</div>
    <div>
      <h2>${city.name}, ${city.country}</h2>
      <p>${city.desc}</p>
      <div class="city-meta-row">
        <span class="meta-chip"><span>📅</span> ${city.bestTime}</span>
        <span class="meta-chip"><span>🌡</span> ${city.temp}</span>
        <span class="meta-chip"><span>💶</span> ${city.moneda}</span>
        <span class="meta-chip"><span>🗣</span> ${city.idioma}</span>
      </div>
    </div>`;
}

function renderSection(){
  const city=data[currentCity];
  const catData=city[currentCat];
  const catNames={playas:'Playas',restaurantes:'Restaurantes',actividades:'Actividades',museos:'Museos',comercio:'Comercio',discotheques:'Discotecas',miradores:'Miradores'};
  const catDescs={
    playas:`Las mejores playas y opciones de agua cerca de ${city.name}`,
    restaurantes:`Dónde comer en ${city.name} — desde clásicos hasta de moda`,
    actividades:`Lo que hay que hacer y ver en ${city.name}`,
    museos:`Los museos y espacios culturales imprescindibles`,
    comercio:`Mercados, tiendas y zonas de compras`,
    discotheques:`La vida nocturna y los mejores clubs de ${city.name}`,
    miradores:`Los mejores puntos de vista y panoramas de ${city.name}`
  };
  const badgeLabels={beach:'Playa',food:'Restaurante',activity:'Actividad',museum:'Museo',shopping:'Compras',disco:'Club',mirador:'Mirador'};
  const priceLabels={cheap:'Económico',mid:'Precio medio',high:'Precio alto'};

  const container=document.getElementById('sections');

  let priceFilterHtml='';
  if(currentCat==='restaurantes'){
    priceFilterHtml=`
      <div class="price-filter">
        <span class="price-filter-label">Precio:</span>
        <div class="price-chip active all" data-price="all">Todos</div>
        <div class="price-chip" data-price="cheap">💚 Económico</div>
        <div class="price-chip" data-price="mid">🟠 Precio medio</div>
        <div class="price-chip" data-price="high">💜 Precio alto</div>
      </div>`;
  }

  let html=`
    <div class="tip-callout"><p><strong>💡 Consejo:</strong> ${catData.tip}</p></div>
    <div class="section-header">
      <h3>${catNames[currentCat]} en ${city.name}</h3>
      <p>${catDescs[currentCat]}</p>
    </div>
    ${priceFilterHtml}
    <div class="cards-grid">`;

  catData.items.forEach(item=>{
    const typeKey=item.badge.replace('badge-','');
    const label=badgeLabels[typeKey]||typeKey;
    const tagsHtml=item.tags.map(t=>`<span class="tag">${t}</span>`).join('');
    const priceKey=item.price||null;
    const hidden=(currentCat==='restaurantes' && currentPrice!=='all' && priceKey!==currentPrice)?'hidden':'';
    const priceBadge=priceKey?`<span class="card-badge badge-price-${priceKey}">${priceLabels[priceKey]}</span>`:'';
    html+=`
      <div class="card ${hidden}" data-price="${priceKey||''}">
        <div class="card-body">
          <div class="card-top">
            <div class="card-name">${item.name}</div>
            <div class="card-badges">
              <span class="card-badge ${item.badge}">${label}</span>
              ${priceBadge}
            </div>
          </div>
          <div class="card-location">${item.location}</div>
          <div class="card-desc">${item.desc}</div>
        </div>
        <div class="card-footer">${tagsHtml}</div>
      </div>`;
  });

  html+=`</div>`;
  container.innerHTML=html;

  if(currentCat==='restaurantes'){
    document.querySelectorAll('.price-chip').forEach(chip=>{
      chip.onclick=()=>{
        currentPrice=chip.dataset.price;
        document.querySelectorAll('.price-chip').forEach(c=>{
          c.className='price-chip'+(c.dataset.price===currentPrice?' active '+c.dataset.price:'');
        });
        document.querySelectorAll('.card[data-price]').forEach(card=>{
          const cp=card.dataset.price;
          card.classList.toggle('hidden', currentPrice!=='all' && cp!==currentPrice);
        });
      };
    });
  }
}

function renderCatNav(){
  document.querySelectorAll('.cat-btn').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.cat===currentCat);
  });
}

function render(){
  renderCityPills();
  renderCityIntro();
  renderCatNav();
  renderSection();
  window.scrollTo({top:0,behavior:'smooth'});
}

document.querySelectorAll('.cat-btn').forEach(btn=>{
  btn.onclick=()=>{
    currentCat=btn.dataset.cat;
    currentPrice='all';
    renderCatNav();
    renderSection();
    document.querySelector('.main').scrollIntoView({behavior:'smooth'});
  };
});

render();
</script>
