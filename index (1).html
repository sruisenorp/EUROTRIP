      {name:'Pastéis de Belém',location:'Belém, Rua de Belém 84–92',badge:'badge-food',price:'cheap',desc:'La pastelería original de los pastéis de nata desde 1837. La cola puede ser larga pero vale la pena — cómelos calientes con canela y azúcar glass en las salas azulejadas.',tags:['Pastéis originales','Desde 1837'],photos:[{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Pastel_de_nata.jpg/1280px-Pastel_de_nata.jpg',credit:'Wikimedia'},{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Pasteis_de_Belem_Lisbon.jpg/1280px-Pasteis_de_Belem_Lisbon.jpg',credit:'Wikimedia'}],mapq:'Pasteis+de+Belem,Lisbon,Portugal'},
      {name:'Zé da Mouraria',location:'Mouraria, Rua João do Outeiro 24',badge:'badge-food',price:'cheap',desc:'La tasca más auténtica del barrio de la Mouraria, cuna del fado. Cocina tradicional portuguesa sin cambios en décadas. Sin carta en inglés, sin turistas.',tags:['Mouraria','Auténtico','Sin turistas'],photos:[{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/Bacalhau_Portuguese_dish.jpg/1280px-Bacalhau_Portuguese_dish.jpg',credit:'Wikimedia'}],mapq:'Mouraria,Lisbon,Portugal'},
      {name:'A Baiuca',location:'Alfama, Rua de São Miguel 20',badge:'badge-food',price:'cheap',desc:'Tasca familiar en Alfama donde se puede cenar con fado en vivo algunos días. El bacalhau à brás y el caldo verde son los platos que piden los habituales.',tags:['Fado en vivo','Tasca','Alfama'],photos:[{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Alfama_Lisbon.jpg/1280px-Alfama_Lisbon.jpg',credit:'Wikimedia'}],mapq:'A+Baiuca,Alfama,Lisbon'},
      {name:'Time Out Market',location:'Cais do Sodré, Av. 24 de Julho 49',badge:'badge-food',price:'mid',desc:'El mejor mercado gastronómico del mundo. Más de 35 puestos de los mejores chefs de Lisboa. El atún, las ostras, los vinos portugueses y los arroces de mariscos son imprescindibles.',tags:['Icónico','Variado','Siempre lleno'],photos:[{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Time_Out_Market_Lisbon.jpg/1280px-Time_Out_Market_Lisbon.jpg',credit:'Wikimedia'}],mapq:'Time+Out+Market,Lisbon,Portugal'},
      {name:'Taberna da Rua das Flores',location:'Chiado, Rua das Flores 103',badge:'badge-food',price:'mid',desc:'El restaurante de moda más querido de Lisboa. Petiscos creativos con producto de temporada, carta que cambia cada día. Solo 12 mesas. Reserva con días de anticipación.',tags:['Petiscos','Temporada','Reserva con días'],photos:[{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/71/Chiado_Lisbon.jpg/1280px-Chiado_Lisbon.jpg',credit:'Wikimedia'}],mapq:'Taberna+da+Rua+das+Flores,Lisbon'},
      {name:'Cervejaria Ramiro',location:'Intendente, Av. Almirante Reis 1',badge:'badge-food',price:'high',desc:'La mejor marisquería de Lisboa desde 1956. Las gambas al ajillo, los percebes y las amêijoas à Bulhão Pato son una institución. Abre hasta las 2h de la madrugada.',tags:['Mariscos','Desde 1956','Hasta las 2h'],photos:[{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/93/Portuguese_seafood.jpg/1280px-Portuguese_seafood.jpg',credit:'Wikimedia'}],mapq:'Cervejaria+Ramiro,Lisbon,Portugal'}
    ]},
    actividades:{tip:'El Tram 28 siempre va lleno y los carteristas lo saben. Sube en la parada inicial (Martim Moniz) y guarda bien la cartera.',items:[
      {name:'Alfama (barrio)',location:'Alfama, al este del centro',badge:'badge-activity',desc:'El barrio más antiguo de Lisboa. Subir hasta el Castillo de São Jorge y bajar despacio parando en cada mirador es la mejor forma de conocer Lisboa.',tags:['Gratis','Imprescindible','Fotogénico'],photos:[{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Alfama_Lisbon.jpg/1280px-Alfama_Lisbon.jpg',credit:'Wikimedia'},{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Castelo_de_Sao_Jorge_Lisbon.jpg/1280px-Castelo_de_Sao_Jorge_Lisbon.jpg',credit:'Wikimedia'}],mapq:'Alfama,Lisbon,Portugal'},
      {name:'Mosteiro dos Jerónimos',location:'Belém, Praça do Império',badge:'badge-activity',desc:'El monasterio más impresionante de Portugal, joya del estilo manuelino. Aquí está enterrado Vasco da Gama. El claustro es de una delicadeza escultural increíble.',tags:['Patrimonio UNESCO','Vasco da Gama'],photos:[{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Jeronimos_Monastery_Lisbon.jpg/1280px-Jeronimos_Monastery_Lisbon.jpg',credit:'Wikimedia'}],mapq:'Mosteiro+dos+Jeronimos,Belem,Lisbon'},
      {name:'Sintra (excursión)',location:'40 min en tren desde Rossio',badge:'badge-activity',desc:'El pueblo de cuento de hadas Patrimonio Mundial UNESCO. El Palácio da Regaleira con sus túneles iniciáticos y el colorido Palácio da Pena en la cima son únicos en Europa.',tags:['Patrimonio UNESCO','Excursión','Palacios'],photos:[{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Palacio_da_Pena_Sintra.jpg/1280px-Palacio_da_Pena_Sintra.jpg',credit:'Wikimedia'}],mapq:'Sintra,Portugal'},
      {name:'LX Factory',location:'Alcântara, Rua Rodrigues de Faria 103',badge:'badge-activity',desc:'Una fábrica del siglo XIX reconvertida en espacio creativo. Los domingos hay mercado de 10h a 18h — el más interesante de la ciudad. Restaurantes, librerías y tiendas de diseño.',tags:['Mercado domingos','Diseño','Ambiente'],photos:[{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/LX_Factory_Lisbon.jpg/1280px-LX_Factory_Lisbon.jpg',credit:'Wikimedia'}],mapq:'LX+Factory,Lisbon,Portugal'},
      {name:'Fado en vivo (Alfama)',location:'Alfama, varios locales',badge:'badge-activity',desc:'El fado auténtico se escucha en Alfama. Sr. Fado (Rua dos Remédios 176), A Tasca do Chico (Rua do Diário de Notícias 39) o Mesa de Frades son los más recomendados.',tags:['Fado auténtico','Alfama','Noche'],photos:[{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Fado_Lisboa.jpg/1280px-Fado_Lisboa.jpg',credit:'Wikimedia'}],mapq:'Fado+Alfama,Lisbon,Portugal'}
    ]},
    museos:{tip:'El primer domingo del mes los museos nacionales son gratuitos. El Museu do Azulejo es el más único de Portugal.',items:[
      {name:'Museu Nacional do Azulejo',location:'Santa Apolónia, Rua da Madre de Deus 4',badge:'badge-museum',desc:'El museo más único de Portugal. La historia del azulejo portugués desde el siglo XV en un convento del siglo XVI. El panorama de Lisboa en azulejo de 23 metros del siglo XVIII es irrepetible.',tags:['Único en el mundo','Convento','Imprescindible'],photos:[{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Azulejo_panel_Portugal.jpg/1280px-Azulejo_panel_Portugal.jpg',credit:'Wikimedia'}],mapq:'Museu+do+Azulejo,Lisbon,Portugal'},
      {name:'Museu Calouste Gulbenkian',location:'Avenidas Novas, Av. de Berna 45A',badge:'badge-museum',desc:'La colección privada más importante de Portugal. Arte egipcio, islámico, europeo y japonés de altísimo nivel en un edificio moderno rodeado de jardines.',tags:['Arte mundial','Jardines','Lalique'],photos:[{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Gulbenkian_Museum_Lisbon.jpg/1280px-Gulbenkian_Museum_Lisbon.jpg',credit:'Wikimedia'}],mapq:'Museu+Gulbenkian,Lisbon,Portugal'},

      {name:'Miradouro de Santa Catarina',location:'Bairro Alto, Rua de Santa Catarina',badge:'badge-mirador',desc:'El mirador más bohemio de Lisboa. Vistas al Tejo, al Puente 25 de Abril y al Cristo Rey. Siempre hay alguien tocando guitarra mirando el atardecer. Gratis y con el mejor ambiente.',tags:['Gratis','Bohemio','Puente 25 de Abril','Atardecer'],photos:[{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Miradouro_Santa_Catarina_Lisbon.jpg/1280px-Miradouro_Santa_Catarina_Lisbon.jpg',credit:'Wikimedia'}],mapq:'Miradouro+de+Santa+Catarina,Lisbon,Portugal'},

      {name:'Castelo de São Jorge',location:'Alfama, Rua de Santa Cruz do Castelo',badge:'badge-mirador',desc:'Las murallas del castillo medieval de Lisboa tienen la vista más alta y completa de la ciudad. La Torre de Ulisses tiene una cámara oscura que proyecta la ciudad en tiempo real.',tags:['Castillo medieval','Cámara oscura','Vista completa'],photos:[{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Castelo_de_Sao_Jorge_Lisbon.jpg/1280px-Castelo_de_Sao_Jorge_Lisbon.jpg',credit:'Wikimedia'}],mapq:'Castelo+de+Sao+Jorge,Lisbon,Portugal'}
    ]}
  }
};

// ─── STATE ───────────────────────────────────────────────────────────────────
let currentCity = 'barcelona';
let currentCat = 'playas';
let currentPrice = 'all';
let currentSlide = 0;
let currentPhotos = [];

// ─── RENDER ──────────────────────────────────────────────────────────────────
function renderCityPills() {
  const c = document.getElementById('cityPills');
  c.innerHTML = '';
  Object.keys(data).forEach(id => {
    const city = data[id];
    const pill = document.createElement('div');
    pill.className = 'city-pill' + (id === currentCity ? ' active' : '');
    pill.textContent = city.flag + ' ' + city.name;
    pill.onclick = () => { currentCity = id; currentPrice = 'all'; render(); };
    c.appendChild(pill);
  });
}

function renderCityIntro() {
  const city = data[currentCity];
  document.getElementById('cityIntro').innerHTML = `
    <div class="city-flag">${city.flag}</div>
    <div>
      <h2>${city.name}, ${city.country}</h2>
      <p>${city.desc}</p>
      <div class="city-meta-row">
        <span class="meta-chip"><span>📅</span> ${city.bestTime}</span>
        <span class="meta-chip"><span>🌡</span> ${city.temp}</span>
        <span class="meta-chip"><span>💶</span> ${city.moneda}</span>
        <span class="meta-chip"><span>🗣</span> ${city.idioma}</span>
      </div>
    </div>`;
}

function renderSection() {
  const city = data[currentCity];
  const catData = city[currentCat];
  const catNames = { playas:'Playas', restaurantes:'Restaurantes', actividades:'Actividades', museos:'Museos', comercio:'Comercio', discotheques:'Discotecas', miradores:'Miradores' };
  const catDescs = {
    playas: `Las mejores playas y opciones de agua cerca de ${city.name}`,
    restaurantes: `Dónde comer en ${city.name} — desde clásicos hasta de moda`,
    actividades: `Lo que hay que hacer y ver en ${city.name}`,
    museos: `Los museos y espacios culturales imprescindibles`,
    comercio: `Mercados, tiendas y zonas de compras`,
    discotheques: `La vida nocturna y los mejores clubs de ${city.name}`,
    miradores: `Los mejores puntos de vista y panoramas de ${city.name}`
  };
  const badgeLabels = { beach:'Playa', food:'Restaurante', activity:'Actividad', museum:'Museo', shopping:'Compras', disco:'Club', mirador:'Mirador' };
  const priceLabels = { cheap:'Económico', mid:'Precio medio', high:'Precio alto' };

  const container = document.getElementById('sections');
  let priceFilterHtml = '';
  if (currentCat === 'restaurantes') {
    priceFilterHtml = `
      <div class="price-filter">
        <span class="price-filter-label">Precio:</span>
        <div class="price-chip active all" data-price="all">Todos</div>
        <div class="price-chip" data-price="cheap">💚 Económico</div>
        <div class="price-chip" data-price="mid">🟠 Precio medio</div>
        <div class="price-chip" data-price="high">💜 Precio alto</div>
      </div>`;
  }

  let html = `
    <div class="tip-callout"><p><strong>💡 Consejo:</strong> ${catData.tip}</p></div>
    <div class="section-header">
      <h3>${catNames[currentCat]} en ${city.name}</h3>
      <p>${catDescs[currentCat]}</p>
    </div>
    ${priceFilterHtml}
    <div class="cards-grid">`;

  catData.items.forEach((item, idx) => {
    const typeKey = item.badge.replace('badge-', '');
    const label = badgeLabels[typeKey] || typeKey;
    const tagsHtml = item.tags.map(t => `<span class="tag">${t}</span>`).join('');
    const priceKey = item.price || null;
    const hidden = (currentCat === 'restaurantes' && currentPrice !== 'all' && priceKey !== currentPrice) ? 'hidden' : '';
    const priceBadge = priceKey ? `<span class="card-badge badge-price-${priceKey}">${priceLabels[priceKey]}</span>` : '';
    html += `
      <div class="card ${hidden}" data-price="${priceKey || ''}" onclick="openModal('${currentCity}','${currentCat}',${idx})">
        <div class="card-body">
          <div class="card-top">
            <div class="card-name">${item.name}</div>
            <div class="card-badges">
              <span class="card-badge ${item.badge}">${label}</span>
              ${priceBadge}
            </div>
          </div>
          <div class="card-location">${item.location}</div>
          <div class="card-desc">${item.desc}</div>
        </div>
        <div class="card-footer">${tagsHtml}</div>
      </div>`;
  });

  html += `</div>`;
  container.innerHTML = html;

  if (currentCat === 'restaurantes') {
    document.querySelectorAll('.price-chip').forEach(chip => {
      chip.onclick = (e) => {
        e.stopPropagation();
        currentPrice = chip.dataset.price;
        document.querySelectorAll('.price-chip').forEach(c => {
          c.className = 'price-chip' + (c.dataset.price === currentPrice ? ' active ' + c.dataset.price : '');
        });
        document.querySelectorAll('.card[data-price]').forEach(card => {
          const cp = card.dataset.price;
          card.classList.toggle('hidden', currentPrice !== 'all' && cp !== currentPrice);
        });
      };
    });
  }
}

function renderCatNav() {
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cat === currentCat);
  });
}

function render() {
  renderCityPills();
  renderCityIntro();
  renderCatNav();
  renderSection();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── MODAL ───────────────────────────────────────────────────────────────────
function openModal(cityId, cat, idx) {
  const item = data[cityId][cat].items[idx];
  currentPhotos = item.photos || [];
  currentSlide = 0;

  const badgeLabels = { beach:'Playa', food:'Restaurante', activity:'Actividad', museum:'Museo', shopping:'Compras', disco:'Club', mirador:'Mirador' };
  const priceLabels = { cheap:'💚 Económico', mid:'🟠 Precio medio', high:'💜 Precio alto' };
  const typeKey = item.badge.replace('badge-', '');
  let badgesHtml = `<span class="card-badge ${item.badge}">${badgeLabels[typeKey] || typeKey}</span>`;
  if (item.price) badgesHtml += `<span class="card-badge badge-price-${item.price}">${priceLabels[item.price]}</span>`;
  document.getElementById('modalBadges').innerHTML = badgesHtml;
  document.getElementById('modalName').textContent = item.name;
  document.getElementById('modalLocation').textContent = item.location;
  document.getElementById('modalDesc').textContent = item.desc;
  document.getElementById('modalTags').innerHTML = item.tags.map(t => `<span class="modal-tag">${t}</span>`).join('');

  // Photos
  const slider = document.getElementById('photoSlider');
  slider.querySelectorAll('.photo-slide').forEach(s => s.remove());

  if (currentPhotos.length > 0) {
    currentPhotos.forEach((p, i) => {
      const slide = document.createElement('div');
      slide.className = 'photo-slide' + (i === 0 ? ' active' : '');
      slide.innerHTML = `<img src="${p.url}" alt="${item.name}" onerror="this.parentElement.style.background='#1a2744'"><div class="photo-credit">${p.credit}</div>`;
      slider.appendChild(slide);
    });
    document.getElementById('sliderDots').innerHTML = currentPhotos.map((_, i) =>
      `<div class="slider-dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>`).join('');
    slider.querySelector('.prev').style.display = currentPhotos.length > 1 ? 'flex' : 'none';
    slider.querySelector('.next').style.display = currentPhotos.length > 1 ? 'flex' : 'none';
  } else {
    slider.style.background = '#1a2744';
    document.getElementById('sliderDots').innerHTML = '';
    slider.querySelector('.prev').style.display = 'none';
    slider.querySelector('.next').style.display = 'none';
  }

  // Map
  const mapQ = encodeURIComponent(item.mapq || item.name);
  document.getElementById('modalMap').innerHTML =
    `<iframe loading="lazy" src="https://maps.google.com/maps?q=${mapQ}&output=embed&z=15" allowfullscreen></iframe>`;

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('modalMap').innerHTML = '';
}

function closeModalOnBg(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function slidePhoto(dir) {
  if (currentPhotos.length <= 1) return;
  currentSlide = (currentSlide + dir + currentPhotos.length) % currentPhotos.length;
  updateSlider();
}

function goToSlide(i) {
  currentSlide = i;
  updateSlider();
}

function updateSlider() {
  document.querySelectorAll('.photo-slide').forEach((s, i) => s.classList.toggle('active', i === currentSlide));
  document.querySelectorAll('.slider-dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.onclick = () => {
    currentCat = btn.dataset.cat;
    currentPrice = 'all';
    renderCatNav();
    renderSection();
    document.querySelector('.main').scrollIntoView({ behavior: 'smooth' });
  };
});

render();
</script>
</body>
</html>
