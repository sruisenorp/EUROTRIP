<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía de Viaje · Europa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #1a2744;
    --navy-light: #2a3d6e;
    --gold: #c8a97e;
    --gold-dark: #a0824f;
    --terracotta: #b45c36;
    --cream: #f7f4ef;
    --cream-dark: #ede9e2;
    --white: #ffffff;
    --text-main: #1e1e1e;
    --text-muted: #777;
    --text-light: #aaa;
    --border: #e0ddd6;
    --green: #4a7c59;
    --purple: #7b4fa6;
    --sidebar-w: 300px;
  }

  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--text-main); min-height: 100vh; }

  /* HERO */
  .hero {
    background: var(--navy);
    padding: 3rem 2rem 2.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 20% 50%, rgba(200,169,126,0.08) 0%, transparent 50%),
                      radial-gradient(circle at 80% 20%, rgba(200,169,126,0.06) 0%, transparent 40%);
  }
  .hero-inner { position: relative; max-width: 600px; margin: 0 auto; }
  .hero-eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1rem;
    font-weight: 500;
  }
  .hero h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 400;
    color: #fff;
    line-height: 1.15;
    margin-bottom: 0.75rem;
  }
  .hero h1 em { font-style: italic; color: var(--gold); }
  .hero-sub { font-size: 14px; color: rgba(255,255,255,0.5); font-weight: 300; }

  /* LAYOUT */
  .layout { display: flex; min-height: calc(100vh - 160px); }

  /* SIDEBAR */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--white);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .sidebar-section { padding: 1.25rem; border-bottom: 1px solid var(--border); }
  .sidebar-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-light);
    font-weight: 600;
    margin-bottom: 0.875rem;
  }

  /* CITY GRID */
  .city-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .city-btn {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.625rem 0.5rem;
    background: var(--white);
    cursor: pointer;
    text-align: left;
    transition: all 0.18s ease;
    display: flex;
    align-items: center;
    gap: 7px;
    user-select: none;
  }
  .city-btn:hover { background: var(--cream); border-color: var(--gold); transform: translateY(-1px); }
  .city-btn.active { background: var(--navy); border-color: var(--navy); }
  .city-btn .flag { font-size: 17px; line-height: 1; }
  .city-btn .city-info .city-name { font-size: 12.5px; font-weight: 500; color: var(--text-main); display: block; }
  .city-btn.active .city-name { color: #fff; }
  .city-btn .city-info .country { font-size: 10px; color: var(--text-light); display: block; }
  .city-btn.active .country { color: rgba(255,255,255,0.5); }

  /* FILTER CHIPS */
  .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 11px;
    font-size: 11.5px;
    background: var(--white);
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
    user-select: none;
    font-family: 'Inter', sans-serif;
  }
  .chip:hover { border-color: var(--gold); color: var(--text-main); }
  .chip.active { background: var(--gold); border-color: var(--gold); color: #fff; }
  .chip svg { width: 13px; height: 13px; }

  /* DAY TABS */
  .day-tabs-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .day-tab {
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 13px;
    font-size: 12px;
    background: var(--white);
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.15s;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
  }
  .day-tab:hover { border-color: var(--terracotta); color: var(--text-main); }
  .day-tab.active { background: var(--terracotta); border-color: var(--terracotta); color: #fff; }

  /* MAIN PANEL */
  .main-panel { flex: 1; overflow-y: auto; }

  .city-header {
    padding: 1.75rem 2.5rem 1.5rem;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .city-header-row { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 0.5rem; }
  .city-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.9rem;
    font-weight: 400;
    color: var(--navy);
  }
  .city-country-badge {
    font-size: 12px;
    color: var(--text-light);
    background: var(--cream);
    padding: 3px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .city-desc { font-size: 13px; color: var(--text-muted); line-height: 1.55; max-width: 560px; }
  .city-meta { display: flex; gap: 1.25rem; margin-top: 0.875rem; }
  .meta-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-muted); }
  .meta-icon { color: var(--gold); font-size: 14px; }

  /* STOPS */
  .stops-area { padding: 1.75rem 2.5rem; }
  .day-heading {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 400;
    font-style: italic;
    color: var(--navy);
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .day-heading::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .stop-card {
    background: var(--white);
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    overflow: hidden;
  }
  .stop-card:hover {
    border-color: var(--gold);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }

  .stop-inner { display: flex; align-items: flex-start; padding: 1rem 1.25rem; gap: 1rem; }

  .stop-time { min-width: 50px; text-align: right; padding-top: 2px; }
  .stop-time-main { font-size: 13px; font-weight: 600; color: var(--navy); display: block; }
  .stop-time-period { font-size: 10px; color: var(--text-light); display: block; }

  .dot-col { display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.food { background: var(--gold); }
  .dot.culture { background: var(--navy); }
  .dot.nature { background: var(--green); }
  .dot.nightlife { background: var(--purple); }
  .dot.shopping { background: var(--terracotta); }

  .stop-body { flex: 1; min-width: 0; }
  .stop-name { font-size: 14px; font-weight: 500; color: var(--text-main); margin-bottom: 3px; }
  .stop-detail { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }

  .stop-badge {
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 10px;
    font-weight: 500;
    white-space: nowrap;
    align-self: flex-start;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .stop-badge.food { background: #fdf3e7; color: #8a5f1e; border: 1px solid #e8d4a0; }
  .stop-badge.culture { background: #eef0f6; color: #1a2744; border: 1px solid #c0c8de; }
  .stop-badge.nature { background: #edf5f0; color: #2e6040; border: 1px solid #a8d4b8; }
  .stop-badge.nightlife { background: #f4eefb; color: #5a2e8a; border: 1px solid #c8aae8; }
  .stop-badge.shopping { background: #faeee9; color: #7a3018; border: 1px solid #e0b09a; }

  .tip-box {
    margin: 0 2.5rem 2rem;
    background: #fff8ee;
    border-left: 3px solid var(--gold);
    border-radius: 0 10px 10px 0;
    padding: 0.875rem 1.125rem;
  }
  .tip-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-dark); font-weight: 600; margin-bottom: 4px; }
  .tip-box p { font-size: 12.5px; color: #7a5a2e; line-height: 1.55; }

  .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-light); }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
  .empty-state p { font-size: 14px; }

  /* COMING SOON BADGE */
  .coming-soon {
    font-size: 9px;
    background: var(--cream-dark);
    color: var(--text-light);
    padding: 2px 6px;
    border-radius: 6px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 2px;
    display: inline-block;
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; min-width: 100%; height: auto; position: relative; }
    .city-header { position: relative; }
  }
</style>
</head>

<div class="hero">

</div>

// Coming soon cities placeholder
const comingSoon = [
  { id: 'porto', name: 'Porto', country: 'Portugal', flag: '🇵🇹' },
  { id: 'ibiza', name: 'Ibiza', country: 'España', flag: '🇪🇸' }
];

let selectedCity = cities[0];
let selectedDay = 0;
let activeFilters = ['all'];

function renderCities() {
  const grid = document.getElementById('cityGrid');
  grid.innerHTML = '';
  cities.forEach(city => {
    const btn = document.createElement('div');
    btn.className = 'city-btn' + (city.id === selectedCity.id ? ' active' : '');
    btn.innerHTML = `<span class="flag">${city.flag}</span><div class="city-info"><span class="city-name">${city.name}</span><span class="country">${city.country}</span></div>`;
    btn.onclick = () => { selectedCity = city; selectedDay = 0; renderAll(); };
    grid.appendChild(btn);
  });
  comingSoon.forEach(city => {
    const btn = document.createElement('div');
    btn.className = 'city-btn';
    btn.style.opacity = '0.5';
    btn.style.cursor = 'default';
    btn.innerHTML = `<span class="flag">${city.flag}</span><div class="city-info"><span class="city-name">${city.name}</span><span class="coming-soon">Próximo</span></div>`;
    grid.appendChild(btn);
  });
}

function renderDayTabs() {
  const tabs = document.getElementById('dayTabs');
  tabs.innerHTML = '';
  selectedCity.days.forEach((d, i) => {
    const tab = document.createElement('div');
    tab.className = 'day-tab' + (i === selectedDay ? ' active' : '');
    tab.textContent = d.label;
    tab.onclick = () => { selectedDay = i; renderItinerary(); renderCities(); renderDayTabs(); };
    tabs.appendChild(tab);
  });
}

function renderFilters() {
  document.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => {
      const f = chip.dataset.filter;
      if (f === 'all') {
        activeFilters = ['all'];
      } else {
        activeFilters = activeFilters.filter(x => x !== 'all');
        if (activeFilters.includes(f)) {
          activeFilters = activeFilters.filter(x => x !== f);
          if (activeFilters.length === 0) activeFilters = ['all'];
        } else {
          activeFilters.push(f);
        }
      }
      document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active',
          activeFilters.includes(c.dataset.filter) ||
          (activeFilters[0] === 'all' && c.dataset.filter === 'all')
        );
      });
      renderItinerary();
    };
  });
}

function renderItinerary() {
  const day = selectedCity.days[selectedDay];
  const header = document.getElementById('cityHeader');
  header.innerHTML = `
    <div class="city-header-row">
      <h2>${selectedCity.flag} ${selectedCity.name}</h2>
      <span class="city-country-badge">${selectedCity.country}</span>
    </div>
    <p class="city-desc">${selectedCity.desc}</p>
    <div class="city-meta">
      <span class="meta-item"><span class="meta-icon">📅</span> Mejor época: ${selectedCity.bestTime}</span>
      <span class="meta-item"><span class="meta-icon">🌡</span> ${selectedCity.avgTemp} verano</span>
      <span class="meta-item"><span class="meta-icon">💶</span> ${selectedCity.currency}</span>
    </div>
  `;

  const area = document.getElementById('stopsArea');
  const showAll = activeFilters.includes('all');
  const visibleStops = day.stops.filter(s => showAll || activeFilters.includes(s.type));
  const tagLabels = { food: 'Gastronomía', culture: 'Cultura', nature: 'Naturaleza', nightlife: 'Nocturna', shopping: 'Shopping' };

  area.innerHTML = `<div class="day-heading">${day.theme}</div>`;

  if (visibleStops.length === 0) {
    area.innerHTML += `<div class="empty-state"><div class="icon">🗺️</div><p>No hay paradas con ese filtro para este día</p></div>`;
  } else {
    visibleStops.forEach(stop => {
      area.innerHTML += `
        <div class="stop-card">
          <div class="stop-inner">
            <div class="stop-time">
              <span class="stop-time-main">${stop.time}</span>
              <span class="stop-time-period">${stop.period}</span>
            </div>
            <div class="dot-col"><div class="dot ${stop.type}"></div></div>
            <div class="stop-body">
              <div class="stop-name">${stop.name}</div>
              <div class="stop-detail">${stop.detail}</div>
            </div>
            <span class="stop-badge ${stop.type}">${tagLabels[stop.type]}</span>
          </div>
        </div>
      `;
    });
  }

  const tipBox = document.getElementById('tipBox');
  document.getElementById('tipText').textContent = day.tip;
  tipBox.style.display = 'block';
}

function renderAll() {
  renderCities();
  renderDayTabs();
  renderItinerary();
}

renderAll();
renderFilters();
</script>
